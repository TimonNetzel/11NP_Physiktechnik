<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16233a">
<title>Mission Stratosphäre 11NP</title>
<style>
:root{
  color-scheme:light;
  --bg:#eef2f7; --card:#ffffff; --ink:#132033; --muted:#4d5a6b; --line:#cfd7e2;
  --acc:#c2410c; --acc-d:#8f2f08; --blue:#17607a; --blue-d:#0f4557;
  --ok:#1b7a47; --okbg:#e2f4e9; --bad:#b42318; --badbg:#fde7e5;
  --gold:#f2b705; --nav:#16233a; --hint:#fff4d1; --hintb:#e7c75c;
  --boss:#7a1d2e; --bossbg:#fbeef1; --purple:#5b3fc4;
  --j11:#4273bd; --j12:#2f8767; --j13:#a86d1c;
  --r:16px; --sh:0 2px 10px rgba(20,32,46,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
.hidden{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
/* Kopf */
.top{position:sticky;top:0;z-index:20;background:var(--nav);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 0 8px}
.top .wrap{display:flex;align-items:center;gap:8px}
.top h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:rgba(255,255,255,.14);border:0;border-radius:999px;padding:7px 11px;color:#fff;font-weight:700;font-size:15px;min-height:40px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;text-decoration:none}
.pill.gold{background:var(--gold);color:#241a00}
/* Hero */
.hero{background:linear-gradient(160deg,#16233a 0%,#24406a 100%);color:#fff;padding:22px 0 24px}
.hero h2{margin:0 0 6px;font-size:25px;line-height:1.2}
.hero p{margin:0;color:#e6edf6}
.kicker{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin-bottom:2px}
.hero .kicker{color:#ffb199}
.stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 12px;font-size:15px;color:#e6edf6}
.stat b{font-size:20px;display:block;color:#fff}
.rankladder{display:flex;gap:4px;margin-top:12px}
.rankladder span{flex:1;min-width:0;overflow-wrap:anywhere;hyphens:auto;font-size:12px;text-align:center;padding:5px 2px;border-radius:8px;background:rgba(255,255,255,.12);color:#cdd8e6;line-height:1.2}
.rankladder span.on{background:var(--gold);color:#241a00;font-weight:800}
/* Missionskarte */
.jahr{margin:20px 0 6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.jahr h3{margin:0;font-size:20px}
.jahr .sj{font-size:14px;color:var(--muted);font-weight:700}
.leit{font-size:15px;color:var(--muted);margin:0 0 8px}
.levels{display:grid;gap:12px;margin:8px 0 10px}
@media(min-width:700px){.levels{grid-template-columns:1fr 1fr}}
.lv{display:flex;gap:14px;align-items:center;background:var(--card);border:2px solid transparent;border-radius:var(--r);padding:14px;box-shadow:var(--sh);text-align:left;width:100%;color:inherit;text-decoration:none}
.lv.next{border-color:var(--acc)}
.lv.vorschau{opacity:.8;background:#f7f9fc;cursor:default}
.lv .num{flex:0 0 48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;background:#e3e9f1;color:var(--nav)}
.lv.done .num{background:var(--ok);color:#fff}
.lv.next .num{background:var(--acc);color:#fff}
.lv .tx{flex:1;min-width:0}
.lv .tag{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);font-weight:800}
.lv .tt{font-weight:800;font-size:17px}
.lv .sub{font-size:14px;color:var(--muted)}
.lv .st{font-size:14px;font-weight:700;color:var(--muted);text-align:center;min-width:48px}
.lv .st b{display:block;font-size:20px}
.j11 .num{box-shadow:inset 0 0 0 3px var(--j11)} .j12 .num{box-shadow:inset 0 0 0 3px var(--j12)} .j13 .num{box-shadow:inset 0 0 0 3px var(--j13)}
/* Inhalt */
.step{padding-top:16px;padding-bottom:120px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:20px;line-height:1.25}
.card h4{margin:12px 0 6px;font-size:17px}
.card p{margin:0 0 10px}
.card ul,.card ol{margin:6px 0 10px;padding-left:22px}
.card li{margin:3px 0}
.zeit{display:inline-block;background:var(--nav);color:#fff;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:800;margin-bottom:6px}
.task{background:#eaf3f7;border-left:5px solid var(--blue);border-radius:10px;padding:10px 12px;margin:10px 0}
.merke{background:#fff8e1;border-left:5px solid var(--gold);border-radius:10px;padding:10px 12px;margin:10px 0}
.warn{background:var(--badbg);border-left:5px solid var(--bad);border-radius:10px;padding:10px 12px;margin:10px 0}
.produkt{background:#f3f0fd;border-left:5px solid var(--purple);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:15px}
.formel{font-family:"Cambria Math","STIX Two Math",Georgia,serif;font-size:1.08em;background:#f4f6fa;border-radius:8px;padding:6px 10px;display:inline-block;margin:2px 0}
.btn{text-decoration:none;border:0;border-radius:12px;padding:11px 16px;min-height:46px;font-weight:800;background:var(--acc);color:#fff;display:inline-flex;align-items:center;gap:6px}
.btn.sek{background:#e3e9f1;color:var(--nav)}
.btn.ok{background:var(--ok)}
.btn.klein{min-height:38px;padding:7px 12px;font-size:15px}
.reihe{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
label.feld{display:block;font-size:14px;font-weight:700;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;border:2px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;min-height:44px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
input[type=range]{width:100%}
.check{display:flex;align-items:center;gap:10px;font-weight:700;margin-top:8px}
.check input{width:24px;height:24px;flex:0 0 24px}
.erledigt{color:var(--ok);font-weight:800}
/* Quiz */
.frage{margin:12px 0 16px}
.frage .f{font-weight:700;margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin:6px 0;min-height:46px}
.opt.richtig{border-color:var(--ok);background:var(--okbg)}
.opt.falsch{border-color:var(--bad);background:var(--badbg)}
.erkl{font-size:15px;background:#f4f6fa;border-radius:10px;padding:8px 12px;margin-top:4px}
/* Rechner */
.rgrid{display:grid;gap:8px 12px;grid-template-columns:1fr 1fr}
@media(max-width:520px){.rgrid{grid-template-columns:1fr}}
.erg{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-top:12px}
.erg div{background:#eaf3f7;border-radius:12px;padding:8px 12px;font-size:14px;color:var(--muted)}
.erg b{display:block;font-size:20px;color:var(--ink)}
.diagramm{width:100%;height:auto;display:block;margin-top:10px;background:#fbfcfe;border-radius:10px}
.rkarte{display:block;text-decoration:none;color:inherit}
.tabelle{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0}
.tabelle th,.tabelle td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:middle}
.tabelle th{background:#f1f4f8}
.tabelle input{min-height:36px;padding:5px 7px}
.balken{height:14px;border-radius:7px;background:#e3e9f1;overflow:hidden;margin-top:6px}
.balken i{display:block;height:100%;background:var(--ok)}
.balken i.zuviel{background:var(--bad)}
/* Fallakte und Risiko */
.fall{border:2px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.fall.fertig{border-color:var(--ok)}
.fall .kopf{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fall .nr{background:var(--nav);color:#fff;border-radius:8px;padding:0 8px;font-weight:800}
.fall .quelle{font-size:13px;color:var(--muted)}
.teamtag{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:1px 8px;background:#e3e9f1;color:var(--nav)}
.matrix{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px;margin-top:10px;font-size:13px}
.matrix .zelle{min-height:62px;border-radius:8px;padding:4px;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start}
.matrix .ach{font-weight:800;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;padding:2px}
.matrix .chip{background:#fff;border-radius:6px;padding:0 6px;font-weight:800;box-shadow:var(--sh)}
.r1{background:#e2f4e9}.r2{background:#fff4d1}.r3{background:#fde7e5}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.filter button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
.filter button.on{border-color:var(--nav);background:var(--nav);color:#fff}
/* Freigabe */
.gate{border:2px dashed var(--boss);background:var(--bossbg)}
.gate.offen{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.gesperrt{text-align:center;color:var(--muted);padding:22px 12px}
/* Teams */
.teams{display:grid;gap:10px}
@media(min-width:700px){.teams{grid-template-columns:1fr 1fr}}
.teamkarte{border:2px solid var(--line);border-radius:14px;padding:12px;background:#fff}
.teamkarte.wahl1{border-color:var(--acc)} .teamkarte.wahl2{border-color:var(--blue)}
.teamkarte h4{margin:0 0 4px}
details{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0;background:#fff}
details summary{font-weight:700;cursor:pointer}
/* Fußleiste */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom) + 6px)}
.tabbar .wrap{display:flex;gap:4px}
.tabbar a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:12px;font-weight:700;padding:4px 2px;border-radius:10px}
.tabbar a span{display:block;font-size:22px;line-height:1.1}
.tabbar a.on{color:var(--acc);background:#fff1ea}
.weiter{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--nav);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:40;box-shadow:var(--sh)}
pre.code{background:#111827;color:#e5edf8;border-radius:10px;padding:12px;overflow-x:auto;font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}
.stationen{display:grid;gap:10px}
@media(min-width:700px){.stationen{grid-template-columns:1fr 1fr}}
.phase{border-top:5px solid var(--blue)}
.phkopf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.phnr{font-size:13px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.05em}
.phkopf .zeit{margin:0}
.chip{display:inline-block;background:#e3e9f1;color:var(--nav);border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700}
.pausekarte{border-top:0;background:#f4f6fa;color:var(--muted);padding:10px 16px}
.clips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.clip{display:inline-flex;align-items:center;gap:4px;background:#b42318;color:#fff;border-radius:10px;padding:8px 12px;font-weight:800;font-size:15px;text-decoration:none;min-height:42px}
.foto{background:#eef7ff;border-left:5px solid var(--blue);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:15px}
.stopp{background:var(--bossbg);border:2px solid var(--boss)}
.stopp .kicker{color:var(--boss)}
.weiche{border:2px solid var(--purple)}
.rundenkopf{background:var(--nav);color:#fff}
.rundenkopf .kicker{color:#ffb199}
.rundenkopf h3{margin:0}
/* Fahrplan eines Tages: Kapitelliste mit Status */
.kapliste ol{list-style:none;padding:0;margin:6px 0}
.kp{margin:6px 0}
.kp a{display:grid;grid-template-columns:52px minmax(0,1fr) 30px;gap:8px;align-items:center;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:#fff;min-height:54px}
.kp .kz{font-weight:800;color:var(--blue)}
.kp .kt{font-weight:700;min-width:0;overflow-wrap:anywhere}
.kp .kt small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.kp .kst{font-size:22px;text-align:center;color:var(--muted)}
.kp.fertig a{background:var(--okbg);border-color:#9fd5b5}
.kp.fertig .kst{color:var(--ok)}
.kp.begonnen .kst{color:var(--blue)}
.kp.plenumsstopp a{border-left:5px solid var(--boss)}
.kp.jetzt a{border:2px solid var(--acc);background:#fff1ea}
.kp.jetzt .kst{color:var(--acc)}
.kp.pause{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;padding:2px 11px;color:var(--muted);font-size:14px}
.kp.pause .kz{font-weight:700;color:var(--muted)}
.btn.gross{display:flex;justify-content:center;text-align:center;width:100%;margin:0 0 14px;font-size:18px;min-height:56px}
.fortschritt{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--muted);font-weight:700}
.fortschritt .balken{flex:1;margin:0;min-width:60px}
.fortschritt span{white-space:nowrap}
.hero .fortschritt span{color:#e6edf6}
.hero .fortschritt .balken{background:rgba(255,255,255,.2)}
.herobalken{margin-top:12px;max-width:460px}
.hero details.ziele{background:rgba(255,255,255,.1);border:0;color:#fff;margin:10px 0 0;max-width:620px}
.hero details.ziele summary{color:#fff}
.hero details.ziele ul{margin:6px 0 2px;padding-left:20px}
.lv .fortschritt{margin-top:8px}
.lv .fortschritt span{white-space:normal}
/* Kapitelseite */
.kapkopf{background:#fff;border-bottom:1px solid var(--line);padding:8px 0 10px}
.kapkopf .wrap:first-child{display:flex;justify-content:space-between;align-items:center;gap:4px 10px;font-size:15px;font-weight:700;flex-wrap:wrap}
.kapkopf a{color:var(--blue-d);text-decoration:none;min-height:36px;display:inline-flex;align-items:center}
.kapkopf span{color:var(--muted);font-size:14px}
.kaptitel{margin:0 0 6px;font-size:23px;line-height:1.2}
.unter{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin:10px 0 2px}
.stopp .unter{color:var(--boss)}
.stoppzeile{font-weight:800;color:var(--boss);font-size:18px}
.phase.stopp{border-top:5px solid var(--boss)}
.mehr details{margin:8px 0;padding:0;background:#f7fafd}
.mehr summary{padding:12px 14px;min-height:48px;display:flex;align-items:center}
.mehr details[open] summary{border-bottom:1px solid var(--line)}
.mehr details > .card{box-shadow:none;margin:0;border-radius:0 0 12px 12px;padding:10px 14px 14px;border:0}
.mehr details > .card > .kicker:first-child{display:none}
.ergebnis{border-left:6px solid var(--purple)}
.ergebnis p{margin:0}
.teamfilter{align-items:center;margin:0 0 12px}
.teamfilter .leit{margin:0 0 0 4px;font-size:13px}
.teamtag.schnell{background:var(--hint);color:#5c4500}
.weiter{flex-wrap:wrap}
.weiter .btn:last-child{flex:1 1 220px;justify-content:center;text-align:center}
.jetztmarke{background:var(--acc);color:#fff;border-radius:6px;padding:0 6px;font-size:12px}
.anleitung{border-left:6px solid var(--blue)}
.vlink{display:block;text-decoration:none;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:9px 12px;margin:8px 0;background:#f7fafd}
.vlink b{display:block;color:var(--blue-d)}
.vlink span{font-size:14px;color:var(--muted)}
/* Simulationen */
.simsvg{width:100%;height:auto;display:block;border-radius:12px;margin:6px 0;max-height:72vh}
.simsvg.klein{max-width:420px;margin:8px auto}
.simknoepfe{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.simknoepfe .btn{min-height:36px;padding:5px 10px;font-size:14px}
.simhinweis{border-radius:10px;padding:10px 12px;margin:10px 0;font-weight:600;background:#eaf3f7;border-left:5px solid var(--blue)}
.simhinweis.ok{background:var(--okbg);border-color:var(--ok)}
.simhinweis.mittel{background:var(--hint);border-color:var(--hintb)}
.simhinweis.kritisch{background:var(--badbg);border-color:var(--bad)}
.simhinweis:empty{display:none}
.simkarte{border-top:5px solid var(--purple)}
.simkarte .kicker{color:var(--purple)}
.laborkopf{margin:16px 0 4px;font-size:19px}
/* Handy quer: Kopf und Fußleiste kompakt, damit Platz für den Inhalt bleibt */
@media (max-height:500px){
  .top{padding-top:calc(env(safe-area-inset-top) + 4px);padding-bottom:4px}
  .pill{min-height:34px;padding:4px 10px}
  .kapkopf{padding:4px 0 6px}
  .kapkopf .fortschritt{margin-top:2px}
  .tabbar{padding-top:3px;padding-bottom:calc(env(safe-area-inset-bottom) + 3px)}
  .tabbar a{padding:3px 2px;font-size:13px}
  .tabbar a span{display:inline;font-size:18px;margin-right:4px;vertical-align:-2px}
}
#druck{display:none}
@media print{
  body.drucken > *:not(#druck){display:none!important}
  body.drucken #druck{display:block;font-size:11pt;color:#000}
  #druck h1{font-size:16pt;margin:0 0 4mm}
  #druck h2{font-size:13pt;margin:6mm 0 2mm;border-bottom:1px solid #999}
  #druck .eintrag{break-inside:avoid;margin-bottom:3mm}
  #druck .eintrag b{display:block}
  @page{size:A4;margin:15mm}
}

    { id: 'j11mi', icon: '🚀', wochentag: 3, tag: 'Jahrgang 11, Mittwoch', zeit: '10:30–13:00 Uhr', titel: 'Grundlagen und c’t-Fallakte', kurz: 'Mittwoch', untertitel: 'Mission, Druck und Temperatur, Pannen der c’t, Fallschirm bauen, Aufträge für Donnerstag',
      ziele: ['Druck und Temperatur in jeder Höhe mit einem Modell bestimmen', 'aus Pannen der c’t Anforderungen an die eigene Sonde ableiten', 'die Sinkgeschwindigkeit eines Fallschirms vorhersagen'],
      bloecke: [
        { typ: 'phase', art: 'plenum', sozial: 'plenum', von: '10:30', bis: '10:45', titel: 'Missionsbriefing',
          html: '<p>Im Herbst 2028 startet ein Wetterballon mit eurer Sonde. Er steigt in etwa zwei Stunden auf über 30 km Höhe. Dort ist der Luftdruck kleiner als 1 % des Bodendrucks, und es wird kälter als −50 °C. Dann platzt der Ballon, und die Sonde sinkt am Fallschirm zurück.</p>' +
            '<div class="task"><b>Leitfrage:</b> Wie bringen wir selbst gebaute Messtechnik 35 km hoch und heil zurück?</div>' +
            '<p>Die Redaktion von heise c’t hat genau das geschafft. Die Lehrkraft zeigt den Start (1 min). Danach schätzt ihr drei Zahlen.</p>',
          clips: [[3, 225, 280]],
          ergebnis: 'Fragen, die wir bis zum Flug klären müssen (Fragenspeicher an der Tafel)' },
        { typ: 'quiz', kicker: 'Schätzen', titel: 'Was meint ihr?', fragen: [
          { id: 'q11_s1', f: 'Welche Höhe erreichte der Ballon der c’t?', o: ['etwa 10 km', 'etwa 100 km', 'etwa 36 km'], r: 2, e: 'Genau 35 734 m. Verkehrsflugzeuge fliegen in etwa 10 km, der Weltraum beginnt bei etwa 100 km.' },
          { id: 'q11_s2', f: 'Wie kalt wird es auf dem Weg nach oben ungefähr?', o: ['etwa −55 °C', 'etwa −5 °C', 'etwa −150 °C'], r: 0, e: 'In 11 bis 20 km Höhe sind es in der Normatmosphäre −56,5 °C. Darüber wird es wieder etwas wärmer.' },
          { id: 'q11_s3', f: 'Wie lange war der Ballon der c’t unterwegs?', o: ['etwa 20 min', 'etwa 3,5 h', 'etwa 12 h'], r: 1, e: 'Etwa 3,5 Stunden. Berechnet waren 3 Stunden. Warum es länger dauerte, klärt die Fallakte.' }
        ] },

        { typ: 'phase', art: 'team', sozial: 'team', von: '10:45', bis: '10:55', titel: 'Team, Rolle und Expertenexperiment',
          html: '<p>Die Teams stehen schon fest, ihr findet sie an der Tafel. Jedes Team wird Experte für ein Experiment. Am Freitag präsentiert ihr es, am Samstag betreut ihr dazu eine Station.</p>',
          ergebnis: 'Team und Rolle eingetragen, Teamregeln stehen, jedes Team kennt sein Barometer-Handy' },
        { typ: 'profil' },
        { typ: 'auftrag', id: 'a11_team', titel: 'Rollen, Regeln und Sensor-Check',
          html: '<ol><li>Verteilt die vier Rollen und tragt eure Rolle oben ein.</li><li>Einigt euch auf drei Regeln und tragt sie unter „Team“ beim Teamvertrag ein.</li><li>Öffnet phyphox, Kategorie „Sensoren“, Experiment „Luftdruck“. Erscheint ein Wert, hat das Handy ein Barometer. Jedes Paar braucht eins.</li></ol>' +
            '<div class="merke"><b>Fotoregeln:</b> Fotografiert vor allem Hände, Technik und Messkurven. Erkennbare Gesichter nur, wenn die Person einverstanden ist und eine Einwilligung vorliegt. Alle Fotos und Videos kommen in den Klassenordner, nicht in private Chats.</div>',
          produkt: 'Rollen, Teamvertrag, Barometer-Handys bekannt' },
        { typ: 'text', kicker: 'Rollen', titel: 'Wer macht was?', html: '<ul><li><b>Teamleitung:</b> Zeit, Absprachen, Aufgaben verteilen</li><li><b>Dokumentation:</b> Fotos und Teamprotokoll</li><li><b>Technik:</b> Aufbau, Material, Sicherheit</li><li><b>Präsentation:</b> Vortrag, Endlos-Präsentation, Station am Samstag</li></ul>' },

        { typ: 'phase', art: 'rechnen', sozial: 'partner', von: '10:55', bis: '11:35', titel: 'Grundlagen Druck und Temperatur',
          html: '<p>Die Lehrkraft lässt zum Einstieg am Beamer einen Ballon durch die Lufthülle der Erde steigen, vom Boden bis zur Raumstation (5 min). Danach erkundet ihr die Simulation selbst.</p>',
          ergebnis: 'Druck und Temperatur in drei Höhen, Quiz gelöst' },
        { typ: 'auftrag', id: 'a11_atm', titel: 'Die Lufthülle erkunden',
          html: '<ol><li>Zieht den Ballon in der Simulation auf 5,5 km, 11 km und 35,7 km. Notiert jeweils Druck und Temperatur.</li><li>Ab welcher Höhe liegen 90 % der Luft unter euch? Wie groß ist dort der Druck?</li><li>Begründet in einem Satz, warum ein Temperaturfühler in 30 km Höhe schlecht abkühlt.</li></ol>' +
            '<div class="merke"><b>Für Schnelle: Wie hoch liegt unsere Schule?</b> Lest in phyphox den Druck im Raum ab. Die Lehrkraft schreibt den Druck aus dem Wetterbericht an, umgerechnet auf Meereshöhe. In Bodennähe entspricht 1 hPa etwa 8,5 m. Vergleicht eure Höhe mit einer Karte.</div>',
          produkt: 'Ergebnisse im Heft oder im Logbuch' },
        { typ: 'text', kicker: 'Wissen', titel: 'Die Atmosphäre in Schichten',
          html: '<p>Die <b>Troposphäre</b> reicht bis etwa 11 km. Dort findet das Wetter statt, und die Temperatur sinkt um etwa 6,5 K je Kilometer. Darüber liegt die <b>Stratosphäre</b> bis etwa 50 km. In ihr bleibt die Temperatur zunächst gleich und steigt dann wieder an, weil Ozon UV-Strahlung der Sonne absorbiert.</p>' +
            '<div class="merke"><b>Merke:</b> Der Luftdruck entsteht durch das Gewicht der Luft darüber. Je höher man steigt, desto weniger Luft liegt darüber. In den unteren Kilometern halbiert sich der Druck etwa alle 5,5 km.</div>' },
        { typ: 'rechner', ids: ['lufthuelle'], bereich: 'haupt' },
        { typ: 'text', kicker: 'Wissen', titel: 'Warum der Ballon wächst',
          html: '<p>Im Ballon ist eine feste Menge Gas eingeschlossen. Steigt er, sinkt der Druck um ihn herum. Das Gas dehnt sich aus, bis sein Druck wieder zum Druck außen passt. Bei gleicher Temperatur gilt <span class="formel">p · V = konstant</span>. Halber Druck heißt also doppeltes Volumen.</p><p>In 35 km Höhe ist der Druck etwa 200-mal kleiner als am Boden. Deshalb wird der Ballon so groß, bis er platzt. Probiert es in der Simulation „Der Ballon wächst“.</p>' },
        { typ: 'rechner', ids: ['ballon', 'atmosphaere'] },
        { typ: 'anleitung', titel: 'Luftdruck mit phyphox messen', videos: [{ id: 'RCsCRDr_Pac', kanal: 'phyphox', laenge: '2 min', text: 'So zeigt phyphox den Luftdruck an und so lest ihr ihn ab.' }] },
        { typ: 'quiz', titel: 'Druck und Temperatur geprüft', fragen: [
          { id: 'q11_bv', f: 'Der Wetterballon steigt, bis der Druck um ihn nur noch halb so groß ist. Was passiert mit seinem Volumen, wenn die Temperatur gleich bleibt?', o: ['Es bleibt gleich, weil die Hülle dicht ist.', 'Es schrumpft, weil Gas aus ihm entweicht.', 'Es verdoppelt sich ungefähr.'], r: 2, e: 'Bei gleicher Temperatur gilt p · V = konstant. Halber Druck ergibt ungefähr doppeltes Volumen, solange die Hülle mitmacht.' },
          { id: 'q11_a1', f: 'Wie groß ist der Luftdruck in 11 km Höhe (Normatmosphäre)?', o: ['etwa 226 hPa', 'etwa 500 hPa', 'etwa 5 hPa'], r: 0, e: 'Etwa 226 hPa, also knapp ein Viertel des Bodendrucks von 1013 hPa. 500 hPa herrschen in etwa 5,5 km Höhe.' },
          { id: 'q11_a2', f: 'In welcher Höhe sind es nur noch 100 hPa?', o: ['etwa 5,5 km', 'etwa 40 km', 'etwa 16 km'], r: 2, e: 'Etwa 16,2 km. Ab hier liegt nur noch ein Zehntel der Luftmasse über dem Ballon.' },
          { id: 'q11_a3', f: 'Warum wird es oberhalb von etwa 20 km wieder wärmer?', o: ['Die Sonde ist dort näher an der Sonne.', 'Ozon nimmt UV-Strahlung auf und heizt die Luft.', 'Warme Luft vom Boden steigt auf und sammelt sich oben.'], r: 1, e: 'Die Ozonschicht nimmt UV-Strahlung auf und gibt die Energie als Wärme an die Luft ab. 30 km näher an der Sonne ändern bei 150 Millionen km Abstand nichts.' }
        ] },

        { typ: 'phase', art: 'pause', von: '11:35', bis: '11:50', titel: 'Pause' },

        { typ: 'phase', art: 'video', sozial: 'team', von: '11:50', bis: '12:10', titel: 'Fallakte c’t im Team',
          html: '<p>Bei der c’t ging einiges schief. Jedes Team untersucht zwei Pannen und leitet daraus ab, was unsere Sonde besser machen muss.</p>',
          ergebnis: 'zwei gelöste Karten je Team, ein Ausschnitt von 30 s und ein Sprecher für das Plenum' },
        { typ: 'auftrag', id: 'a11_fall', titel: 'Zwei Karten lösen',
          html: '<ol><li><b>Video (8 min):</b> Schaut auf einem Handy oder iPad die Ausschnitte zu euren zwei Karten, mit Kopfhörern oder leise. Die roten Knöpfe springen an die richtige Stelle.</li><li><b>Karten (8 min):</b> Wählt Ursache und Gegenmaßnahme und schätzt Wahrscheinlichkeit und Auswirkung ein.</li><li><b>Vorbereiten (4 min):</b> Wählt einen Ausschnitt von 30 Sekunden für das Plenum und bestimmt einen Sprecher.</li></ol>',
          produkt: 'zwei Karten gelöst, Sprecher bestimmt' },
        { typ: 'fallakte', titel: 'Was ging bei den Profis schief?',
          html: '<p>Die App zeigt zuerst die Karten eures Teams. Karten mit dem Hinweis „Für Schnelle“ sind freiwillig.</p>' },

        { typ: 'phase', art: 'plenum', sozial: 'plenum', stopp: true, von: '12:10', bis: '12:30', titel: 'Teams stellen ihre Karten vor',
          html: '<p>Jedes Team zeigt einen Ausschnitt von 30 Sekunden und nennt in zwei Minuten Ursache, Gegenmaßnahme und Risiko. Danach entsteht die gemeinsame Risikomatrix.</p>',
          ergebnis: 'Risikomatrix v1 mit allen Karten und mindestens einem eigenen Risiko',
          foto: 'Bildschirmfoto der fertigen Risikomatrix' },
        { typ: 'risiko', titel: 'Risikomatrix v1',
          html: '<p>Jede gelöste Karte erscheint hier. Ergänzt mindestens ein eigenes Risiko für unsere Sonde.</p>' },

        { typ: 'phase', art: 'bauen', sozial: 'partner', von: '12:30', bis: '12:45', titel: 'Grundlagen Fallschirm',
          html: '<p>Am Freitag lasst ihr euren Fallschirm im Treppenhaus fallen. Wer die Sinkgeschwindigkeit heute am besten vorhersagt, gewinnt den Fallschirm-Wettbewerb.</p>',
          ergebnis: 'Fallschirm gewogen und beschriftet, Vorhersage notiert' },
        { typ: 'auftrag', id: 'a11_fs_bau', titel: 'Fallschirm bauen und vorhersagen',
          html: '<p>Material je Paar: Quadrat aus einem Müllbeutel (40 cm × 40 cm), vier Schnüre zu je 40 cm, Klebeband, 20 g Knete.</p>' +
            '<ol><li><b>Bauen (8 min):</b> Ecken mit Klebeband verstärken, an jede Ecke eine Schnur, unten alle Schnüre in der Knete zusammenführen.</li><li><b>Wiegen (2 min):</b> Den fertigen Fallschirm wiegen und mit euren Namen beschriften.</li><li><b>Vorhersagen (5 min):</b> Im Fallschirmrechner eure Masse, c<sub>w</sub> ≈ 1,3 und die Fläche 0,16 m² eingeben. Die Sinkgeschwindigkeit unten notieren.</li></ol>',
          produkt: 'Fallschirm mit Masse, Vorhersage in m/s' },
        { typ: 'notiz', id: 'n11_vorhersage', titel: 'Unsere Vorhersage für den Wettbewerb', felder: ['Masse des Fallschirms in g', 'vorhergesagte Sinkgeschwindigkeit in m/s'] },
        { typ: 'text', kicker: 'Wissen', titel: 'Warum ein Fallschirm gleichmäßig sinkt',
          html: '<p>Je schneller der Schirm fällt, desto größer wird der Luftwiderstand. Bald sind Gewichtskraft und Luftwiderstand gleich groß. Ab dann sinkt er mit konstanter Geschwindigkeit.</p><p><span class="formel">m · g = ½ · ρ · c<sub>w</sub> · A · v²</span></p><p>Eine größere Fläche A macht ihn langsamer. Eine größere Masse m macht ihn schneller, aber nur mit der Wurzel: doppelte Masse ergibt etwa 1,4-fache Geschwindigkeit.</p>' },
        { typ: 'rechner', ids: ['fallschirm', 'sprung'] },
        { typ: 'anleitung', titel: 'Fallschirm bauen', videos: [
          { id: 'yhj3Ow_5B-k', kanal: 'WEsion', laenge: '7 min', text: 'Schritt für Schritt einen kleinen Fallschirm aus einer Tüte und Schnur basteln.' },
          { id: 'uA_qzmaDF_8', kanal: 'Experiment Army', laenge: '5 min', sprache: 'englisch, auch ohne Ton verständlich', text: 'Fallschirm aus einer Plastiktüte, gut zum Mitschauen beim Bauen.' }
        ] },
        { typ: 'quiz', titel: 'Fallschirm geprüft', fragen: [
          { id: 'q11_f1', f: 'Ihr verdoppelt die Last am Fallschirm. Wie ändert sich die Sinkgeschwindigkeit?', o: ['Sie wird genau doppelt so groß.', 'Sie wird etwa 1,4-mal so groß.', 'Sie bleibt ungefähr gleich groß.'], r: 1, e: 'Aus m · g = ½ · ρ · c_w · A · v² folgt v ~ √m. Doppelte Masse ergibt √2 ≈ 1,4-fache Geschwindigkeit.' }
        ] },

        { typ: 'phase', art: 'schreiben', sozial: 'gemischt', von: '12:45', bis: '13:00', titel: 'Aufträge für Donnerstag',
          html: '<p>Am Donnerstag ist kein Projekttag. Ihr erledigt zwei Aufträge zu Hause, damit am Freitag alles bereitsteht.</p>',
          ergebnis: 'Druckmessung vergeben, jedes Team weiß, welche Box es mitbringt' },
        { typ: 'auftrag', id: 'a11_druck24', titel: 'Luftdruck über Nacht messen',
          html: '<p>Je Team nimmt ein Schüler mit Barometer-Handy die Messung mit nach Hause.</p><ol><li>Am Mittwochabend phyphox öffnen, Kategorie „Sensoren“, Experiment „Luftdruck“, Start drücken. Das Handy flach hinlegen und nicht bewegen.</li><li>Ladekabel anschließen, die automatische Bildschirmsperre ausschalten, phyphox im Vordergrund lassen.</li><li>Am Donnerstagmorgen stoppen, die Kurve als Bildschirmfoto sichern oder als CSV exportieren und in den Klassenordner legen.</li></ol><p class="leit">phyphox speichert dabei nur den Luftdruck, keinen Standort.</p>',
          produkt: 'Druckkurve von Mittwoch auf Donnerstag im Klassenordner' },
        { typ: 'auftrag', id: 'a11_boxsuche', titel: 'Eine Box für den Kältetest suchen',
          html: '<p>Am Freitag prüfen wir draußen, welche Box Wärme am besten hält. Jedes Team bringt eine Box mit.</p><ol><li>Sucht zu Hause eine Box, in die eine 250-ml-Flasche stehend passt und die sich schließen lässt. Beispiele: Styropor-Versandbox, Kühltasche, Brotdose, Schuhkarton.</li><li>Sagt Team B heute vor 13:00 Uhr, welche Box ihr sucht. So bringen nicht alle dasselbe mit.</li><li>Notiert Material und Wandstärke und bringt die Box leer am Freitag mit.</li></ol><p class="leit">Die Lehrkraft bringt zwei gleiche Styroporboxen mit. Eine davon steht im Fahrtwind.</p>',
          produkt: 'Box mit Notiz zu Material und Wandstärke' },
        { typ: 'notiz', id: 'n11_box', titel: 'Unsere Box', felder: ['Material und Wandstärke', 'Wer bringt sie mit?'] },
        { typ: 'ideen', html: '<p>Am Samstag zeigen wir das Projekt am Tag der offenen Tür. Was soll dort passieren? Notiert eure Ideen hier und an der Ideenwand im Raum. Am Freitag um 08:00 Uhr stimmen wir ab. Die App speichert nur auf deinem Gerät, deshalb zählt die Ideenwand im Raum.</p>' },
        { typ: 'quiz', kicker: 'Exit', titel: 'Was nehmt ihr mit?', fragen: [
          { id: 'q11_x2', f: 'Warum braucht die Sonde ein kleines Loch für den Druckausgleich?', o: ['damit Regenwasser aus der Box ablaufen kann', 'damit die Kamera durch das Loch filmen kann', 'damit der Drucksensor den Außendruck misst'], r: 2, e: 'Innen und außen soll derselbe Druck herrschen. Sonst misst der Sensor falsch, und die Box könnte durch Überdruck aufplatzen.' },
          { id: 'q11_x3', f: 'Warum steht am Freitag auch eine Flasche ganz ohne Box im Kältetest?', o: ['Sie zeigt, wie viel die Dämmung überhaupt bringt.', 'Sie wird gebraucht, um die Thermometer zu prüfen.', 'Sie ersetzt das Thermometer für die Außenluft.'], r: 0, e: 'Ohne Vergleich wisst ihr nicht, ob eine Box viel oder wenig bringt. Die Flasche ohne Box ist die Messung „ohne Dämmung“.' }
        ] },
        { typ: 'logbuch', titel: 'Logbuch Mittwoch', html: '<p class="leit">Schreibe jetzt zwei Sätze zur ersten Frage. Den Rest ergänzt du zu Hause.</p>' },
        { typ: 'checkliste', id: 'cl11_mi', titel: 'Bevor du gehst (Mittwoch)', punkte: ['Mein Team und meine Rolle stehen im Profil.', 'Unser Fallschirm ist gewogen, beschriftet und liegt in der Projektkiste.', 'Die Messung über Nacht übernimmt ein Schüler unseres Teams.', 'Wir wissen, welche Box wir am Freitag mitbringen.', 'Meine Idee für Samstag steht an der Ideenwand.'] }
      ] },

    /* ================= Jahrgang 11, Freitag 8:00–13:00 ================= */
    { id: 'j11fr', icon: '🧊', wochentag: 5, tag: 'Jahrgang 11, Freitag', zeit: '08:00–13:00 Uhr', titel: 'Messen und Präsentieren', kurz: 'Freitag', untertitel: 'Kältetest draußen, Treppenhaus und Fallschirm-Wettbewerb, Auswertung, Präsentation und Generalprobe',
      ziele: ['einen Kältetest nach Prüfauftrag durchführen und auswerten', 'aus einem Druckunterschied einen Höhenunterschied bestimmen', 'das eigene Experiment mit einer Zahl und einer Anforderung an die Sonde präsentieren'],
      bloecke: [
        { typ: 'phase', art: 'plenum', sozial: 'plenum', stopp: true, von: '08:00', bis: '08:10', titel: 'Start und Abstimmung',
          html: '<p>Heute um 12:45 Uhr steht alles für Samstag. Zuerst stimmen wir über die Ideenwand ab. Jeder hat zwei Stimmen, die zwei Ideen mit den meisten Stimmen werden heute umgesetzt.</p>',
          ergebnis: 'zwei Ideen für Samstag gewählt, Nachtkurven und Boxen liegen bereit' },
        { typ: 'ideen', titel: 'Eure Ideen' },

        { typ: 'phase', art: 'messen', sozial: 'team', von: '08:10', bis: '08:25', titel: 'Kältetest draußen starten',
          html: '<p>Unsere Elektronik muss in der Sonde warm bleiben. Ersatz für die Elektronik ist eine Flasche mit 40 °C warmem Wasser. Der Test läuft 60 Minuten, während ihr an den Stationen seid.</p>',
          ergebnis: 'Test läuft, die Messliste der Messwache beginnt',
          foto: 'Alle Boxen nebeneinander unter dem Vordach, dazu der Ventilator' },
        { typ: 'auftrag', id: 'a11_kaelte', titel: 'Kältetest aufbauen',
          html: '<ol><li><b>Vorbereiten (5 min):</b> Box wiegen, Masse und Team auf die Box schreiben. Die Lehrkraft füllt die Flaschen mit Wasser von 40 °C. Fühler an die Flasche kleben, Box schließen.</li><li><b>Aufstellen (5 min):</b> Alle Boxen, die Flasche ohne Box und das Thermometer für die Außenluft stehen nebeneinander im Schatten unter dem Vordach, auf einer Dämmplatte. Der Ventilator steht 1 m vor der Box „Wind“, immer auf derselben Stufe.</li><li><b>Messwache (60 min):</b> Alle 5 Minuten liest die Messwache alle Anzeigen ab und trägt sie in die gemeinsame Liste ein. Jede Viertelstunde übernimmt ein Schüler aus dem nächsten Team.</li></ol>' +
            '<div class="warn">Ventilator und Verlängerungskabel bleiben trocken und liegen nicht in Pfützen. Bei Regen stehen alle Boxen unter dem Dach.</div>',
          produkt: 'Test läuft, Masse jeder Box steht auf der Box' },
        { typ: 'notiz', id: 'n11_hyp', titel: 'Eure Hypothese', html: '<p class="leit">Für Schnelle: Gebt Material und Wandstärke eurer Box in die Simulation „Abkühlkurve vorhersagen“ ein und notiert die Vorhersage.</p>', felder: ['Welche Box hält die Wärme am besten, und warum?', 'Was macht der Fahrtwind?', 'Vorhersage der Simulation: Abfall nach 60 min in K'] },
        { typ: 'rechner', ids: ['abkuehlung'] },
        { typ: 'text', kicker: 'Prüfauftrag', titel: 'So ist der Kältetest festgelegt',
          html: '<ul><li><b>Objekt und Messgröße:</b> Temperatur des Wassers in jeder Box</li><li><b>Messmittel und Messstelle:</b> Kabelthermometer, Fühlerspitze an der Flasche</li><li><b>Ablauf:</b> Start bei 40 °C, alle 5 Minuten ablesen, 60 Minuten lang</li><li><b>Entscheidungskriterium:</b> Temperaturabfall nach 60 Minuten im Verhältnis zur Masse der Box</li></ul>' },
        { typ: 'text', kicker: 'Plan B', titel: 'Bei mildem Wetter über 10 °C',
          html: '<p>Die Lehrkraft setzt eine Kältemischung aus Eis und Kochsalz (3 : 1) in einer großen Kühlbox an. Sie wird etwa −15 °C bis −20 °C kalt. Dort passen zwei bis drei Boxen gleichzeitig hinein.</p>' },
        { typ: 'anleitung', titel: 'Plan B: Kältemischung ansetzen', videos: [{ id: 'fDmCnu_VJFM', kanal: 'Kantonsschule Zürich Nord', laenge: '1 min', text: 'Eis und Kochsalz werden gemischt, das Thermometer zeigt, wie kalt es wird.' }] },

        { typ: 'phase', art: 'messen', sozial: 'paare', von: '08:25', bis: '09:05', titel: 'Stationen Runde 1',
          html: '<p>Jedes Team teilt sich in zwei Paare. Ein Paar startet im Treppenhaus, das andere am Fallschirm. Um 09:05 Uhr wird gewechselt.</p>',
          ergebnis: 'Messtabelle der ersten Station ausgefüllt',
          foto: 'Druckkurve als Bildschirmfoto oder Fallschirm im Flug als Zeitlupenvideo' },
        { typ: 'stationen', id: 'st11', runde: 1, titel: 'Wo startet euer Paar?', runden: ['08:25–09:05', '09:05–09:45'],
          html: '<p>Wählt eure Startstation. In Runde 2 zeigt die App automatisch die andere Station.</p>',
          stationen: { A: { titel: 'Treppenhaus', r1: TREPPE, r2: TREPPE }, B: { titel: 'Fallschirm', r1: FALL, r2: FALL } } },

        { typ: 'phase', art: 'messen', sozial: 'paare', von: '09:05', bis: '09:45', titel: 'Stationen Runde 2',
          html: '<p>Wechsel. Ihr bearbeitet jetzt die andere Station. Der Kältetest endet um 09:25 Uhr, die letzte Messwache bringt die Liste herein.</p>',
          ergebnis: 'beide Stationen gemessen, Kältetest beendet',
          foto: 'Wettbewerbsliste am Fallschirm, Messliste des Kältetests' },
        { typ: 'stationen', id: 'st11', runde: 2, titel: 'Wo hat euer Paar begonnen?', runden: ['08:25–09:05', '09:05–09:45'],

<script>

(function () {
  'use strict';
  var P = PROJEKT;
  var KEY = 'projekt_' + P.id;
  var app = document.getElementById('app');

  /* ---------- Zustand ---------- */
  function leer() {
    return { name: '', team: '', rolle: '', wunsch: ['', ''], done: {}, quiz: {}, log: {}, fall: {}, eigen: [], frei: {}, werte: {}, masse: null, pitch: {}, vertrag: {}, feedback: {} };
  }
  var S = leer();
  try {
    var roh = localStorage.getItem(KEY);
    if (roh) { var gel = JSON.parse(roh); for (var k in gel) S[k] = gel[k]; }
  } catch (e) { /* privat oder gesperrt: ohne Speicher weiter */ }
  function speichern() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ohne Speicher */ }
    kopfZeile();
  }

  /* ---------- Hilfen ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function zahl(v) { var x = parseFloat(String(v).replace(',', '.')); return isFinite(x) ? x : NaN; }
  function fmt(x, d) {
    if (!isFinite(x)) return '–';
    var s = x.toFixed(d == null ? 2 : d).replace('.', ',');
    if (s.charAt(0) === '-') s = '\u2212' + s.slice(1);
    var teile = s.split(',');
    teile[0] = teile[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return teile.join(',');
  }
  function $(sel, el) { return (el || document).querySelector(sel); }
  function $$(sel, el) { return Array.prototype.slice.call((el || document).querySelectorAll(sel)); }
  function toast(t) {
    var d = document.createElement('div');
    d.className = 'toast'; d.textContent = t;
    document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 1800);
  }
  function hash(s) {
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return ('00000000' + h.toString(16)).slice(-8);
  }
  function codeOk(eingabe) {
    eingabe = String(eingabe || '').trim();
    if (!eingabe) return false;
    if (!CONFIG.codeHash) return true;
    return hash(eingabe) === CONFIG.codeHash;
  }

  /* ---------- Punkte und Ränge ---------- */
  function punkte() {
    var p = 0, k;
    for (k in S.done) if (S.done[k]) p += 10;
    for (k in S.quiz) if (S.quiz[k] && S.quiz[k].erst) p += 5;
    for (k in S.log) if (logVoll(k)) p += 10;
    for (k in S.fall) if (S.fall[k] && S.fall[k].u != null && S.fall[k].m != null) p += 5;
    return p;
  }
  function rang(p) {
    var r = P.raenge[0];
    P.raenge.forEach(function (x) { if (p >= x.ab) r = x; });
    return r;
  }
  function kopfZeile() {
    var p = punkte();
    $('#punkte').textContent = p + ' P';
  }
  function logVoll(eid) {
    var l = S.log[eid];
    if (!l) return false;
    var n = 0;
    for (var k in l) if (String(l[k]).trim().length > 15) n++;
    return n >= 3;
  }

  /* ---------- Normatmosphäre ---------- */
  var G0 = 9.80665, RL = 287.053;
  var SCH = [[0, 288.15, -0.0065, 101325], [11000, 216.65, 0, 0], [20000, 216.65, 0.001, 0], [32000, 228.65, 0.0028, 0], [47000, 270.65, 0, 0], [51000, 270.65, -0.0028, 0], [71000, 214.65, -0.002, 0]];
  (function () {
    for (var i = 1; i < SCH.length; i++) {
      var a = SCH[i - 1], h1 = SCH[i][0];
      SCH[i][3] = a[2] === 0 ? a[3] * Math.exp(-G0 * (h1 - a[0]) / (RL * a[1])) : a[3] * Math.pow(1 + a[2] * (h1 - a[0]) / a[1], -G0 / (a[2] * RL));
    }
  })();
  function atm(h) {
    h = Math.max(0, Math.min(h, 86000));
    var i = SCH.length - 1;
    while (i > 0 && h < SCH[i][0]) i--;
    var s = SCH[i], T = s[1] + s[2] * (h - s[0]);
    var p = s[2] === 0 ? s[3] * Math.exp(-G0 * (h - s[0]) / (RL * s[1])) : s[3] * Math.pow(1 + s[2] * (h - s[0]) / s[1], -G0 / (s[2] * RL));
    return { p: p, T: T, rho: p / (RL * T) };
  }
  function hoeheAusDruck(p) {
    var lo = 0, hi = 50000;
    for (var i = 0; i < 60; i++) { var m = (lo + hi) / 2; if (atm(m).p > p) lo = m; else hi = m; }
    return lo;
  }
  var RHO_L = 101325 / (RL * 288.15);
  var RHO_HE = 101325 * 0.0040026 / (8.314462 * 288.15);

  /* ---------- Diagramm ---------- */
  function diagramm(reihen, o) {
    var W = 640, H = 300, L = 58, R = 14, T = 14, B = 44;
    var xs = [], ys = [];
    reihen.forEach(function (r) { r.punkte.forEach(function (q) { if (isFinite(q[0]) && isFinite(q[1])) { xs.push(q[0]); ys.push(q[1]); } }); });
    if (!xs.length) return '<p class="leit">Noch keine Messwerte.</p>';
    var x0 = o.x0 != null ? o.x0 : Math.min.apply(null, xs), x1 = o.x1 != null ? o.x1 : Math.max.apply(null, xs);
    var y0 = o.y0 != null ? o.y0 : Math.min.apply(null, ys), y1 = o.y1 != null ? o.y1 : Math.max.apply(null, ys);
    if (x1 === x0) x1 = x0 + 1;
    if (y1 === y0) { y1 = y0 + 1; y0 = y0 - 1; }
    function X(v) { return L + (v - x0) / (x1 - x0) * (W - L - R); }
    function Y(v) { return H - B - (v - y0) / (y1 - y0) * (H - T - B); }
    var g = '';
    for (var i = 0; i <= 5; i++) {
      var vx = x0 + (x1 - x0) * i / 5, vy = y0 + (y1 - y0) * i / 5;
      g += '<line x1="' + X(vx) + '" y1="' + T + '" x2="' + X(vx) + '" y2="' + (H - B) + '" stroke="#e3e9f1"/>';
      g += '<line x1="' + L + '" y1="' + Y(vy) + '" x2="' + (W - R) + '" y2="' + Y(vy) + '" stroke="#e3e9f1"/>';
      g += '<text x="' + X(vx) + '" y="' + (H - B + 18) + '" font-size="13" text-anchor="middle" fill="#4d5a6b">' + fmt(vx, o.dx || 0) + '</text>';
      g += '<text x="' + (L - 6) + '" y="' + (Y(vy) + 4) + '" font-size="13" text-anchor="end" fill="#4d5a6b">' + fmt(vy, o.dy || 0) + '</text>';
    }
    g += '<text x="' + ((L + W - R) / 2) + '" y="' + (H - 6) + '" font-size="14" text-anchor="middle" fill="#132033">' + esc(o.xl) + '</text>';
    g += '<text x="14" y="' + ((T + H - B) / 2) + '" font-size="14" text-anchor="middle" fill="#132033" transform="rotate(-90 14 ' + ((T + H - B) / 2) + ')">' + esc(o.yl) + '</text>';
    var farben = ['#c2410c', '#17607a', '#1b7a47', '#5b3fc4', '#a86d1c', '#7a1d2e'];
    reihen.forEach(function (r, j) {
      var f = r.farbe || farben[j % farben.length];
      var pts = r.punkte.filter(function (q) { return isFinite(q[0]) && isFinite(q[1]); });
      if (pts.length > 1 && !r.nurPunkte) g += '<polyline fill="none" stroke="' + f + '" stroke-width="3" points="' + pts.map(function (q) { return X(q[0]).toFixed(1) + ',' + Y(q[1]).toFixed(1); }).join(' ') + '"/>';
      if (r.marken || r.nurPunkte) pts.forEach(function (q) { g += '<circle cx="' + X(q[0]) + '" cy="' + Y(q[1]) + '" r="5" fill="' + f + '"/>'; });
    });
    if (o.legende) g += reihen.map(function (r, j) { return '<text x="' + (L + 10) + '" y="' + (T + 16 + 18 * j) + '" font-size="13" font-weight="700" fill="' + (r.farbe || farben[j % farben.length]) + '">' + esc(r.name) + '</text>'; }).join('');
    return '<svg class="diagramm" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.yl + ' gegen ' + o.xl) + '">' + g + '</svg>';
  }

    return html + '</div>';
  }

  function tagListe() {
    var l = [];
    P.jahre.forEach(function (j) { (j.etappen || []).forEach(function (x) { l.push(x); }); });
    return l;
  }
  /* Tagesseite: Fahrplan als Kapitelliste mit Status */
  function tagSeite(eid) {
    var e = etappen[eid];
    if (!e) return startSeite();
    var kap = kapitelVon(e), f = etappenFortschritt(e);
    var html = '<section class="hero"><div class="wrap"><div class="kicker">' + esc(e.tag) + '</div><h2>' + e.icon + ' ' + esc(e.titel) + '</h2><p>' + esc(e.untertitel) + '</p>' +
      '<div class="herobalken">' + balken(f) + '</div>' +
      (e.ziele ? '<details class="ziele"><summary>Am Ende kannst du …</summary><ul>' + e.ziele.map(function (z) { return '<li>' + esc(z) + '</li>'; }).join('') + '</ul></details>' : '') + '</div></section><div class="wrap step">';
    var jetzt = kap.filter(function (k) { return !k.pause && istJetzt(e, k.phase); })[0];
    var offen = kap.filter(function (k) { return !k.pause && kapitelStatus(e, k) !== 'fertig'; })[0];
    var ziel = jetzt || offen;
    if (ziel) html += '<a class="btn gross" href="#/e/' + eid + '/' + ziel.nr + '">' + (jetzt ? '▶ Jetzt: ' : '▶ Weiter mit ') + esc(ziel.phase.titel) + '</a>';
    html += '<div class="card kapliste"><div class="kicker">Fahrplan</div><h3>' + e._kapN + ' Kapitel' + (e.zeit ? ', ' + esc(e.zeit) : '') + '</h3><ol>' + kap.map(function (k) {
      var ph = k.phase;
      if (k.pause) return '<li class="kp pause"><span class="kz">' + esc(ph.von || '') + '</span><span class="kt">☕ ' + esc(ph.titel || 'Pause') + (ph.bis ? ' bis ' + esc(ph.bis) : '') + '</span></li>';
      var st = kapitelStatus(e, k), an = istJetzt(e, ph);
      var zeichen = st === 'fertig' ? '✓' : (an ? '●' : (st === 'begonnen' ? '◐' : '○'));
      return '<li class="kp ' + st + (an ? ' jetzt' : '') + (ph.stopp ? ' plenumsstopp' : '') + '"><a href="#/e/' + eid + '/' + k.nr + '"><span class="kz">' + (ph.von ? esc(ph.von) : k.nr + '.') + '</span><span class="kt">' + (ph.stopp ? '✋' : (ART[ph.art] || '')) + ' ' + esc(ph.titel) + (an ? ' <b class="jetztmarke">jetzt</b>' : '') +
        '<small>' + esc((ph.stopp ? 'Plenumsstopp' : (SOZIAL[ph.sozial] || '')) + (ph.von && ph.bis ? ', bis ' + ph.bis : '')) + '</small></span><span class="kst" aria-label="' + st + '">' + zeichen + '</span></a></li>';
    }).join('') + '</ol><p class="leit">✓ erledigt, ◐ begonnen, ○ offen. „jetzt“ richtet sich nach Wochentag und Uhrzeit deines Geräts.</p></div>';
    var liste = tagListe(), i = liste.indexOf(eid);
    html += '<div class="weiter">' + (i > 0 ? '<a class="btn sek" href="#/e/' + liste[i - 1] + '">← ' + esc(etappen[liste[i - 1]].kurz) + '</a>' : '<a class="btn sek" href="#/">← Missionskarte</a>') +
      (i < liste.length - 1 ? '<a class="btn sek" href="#/e/' + liste[i + 1] + '">' + esc(etappen[liste[i + 1]].kurz) + ' →</a>' : '') + '</div>';
    return html + '</div>';
  }

  /* Kapitelseite: Darum geht's, Auftrag, Nachschlagen (aufklappbar), Prüfen, Ergebnis, Weiter */
  var MEHR = { text: 1, rechner: 1, anleitung: 1 };
  function mehrEintraege(b) {
    if (b.typ === 'rechner') return b.ids.map(function (id) { return [(RECHNER[id].sim ? '🛰️ Simulation: ' : '🧮 Rechner: ') + RECHNER[id].titel, rechnerKarte(id, true), b._bid + '_' + id]; });
    if (b.typ === 'anleitung') return [['🎥 Video: ' + b.titel, blockAnleitung(b), b._bid]];
    return [['📖 ' + (b.kicker || 'Wissen') + ': ' + b.titel, blockText(b), b._bid]];
  }
  function kapitelSeite(eid, n) {
    var e = etappen[eid];
    if (!e) return startSeite();
    var k = kapitelNr(e, n);
    if (!k) return tagSeite(eid);
    var ph = k.phase, an = istJetzt(e, ph);
    S.werte['bes_' + ph._bid] = true;
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (x) { /* ohne Speicher */ }
    var html = '<div class="kapkopf"><div class="wrap"><a href="#/e/' + eid + '">← ' + esc(e.kurz) + ': Fahrplan</a><span>Kapitel ' + n + ' von ' + e._kapN + '</span></div><div class="wrap">' + balken(etappenFortschritt(e)) + '</div></div><div class="wrap step">';
    html += '<div class="card phase' + (ph.stopp ? ' stopp' : '') + '"><div class="phkopf">' + (ph.von ? '<span class="zeit">' + zeitSpanne(ph) + '</span>' : '') +
      '<span class="chip">' + esc(ph.stopp ? 'Plenumsstopp' : (SOZIAL[ph.sozial] || ph.sozial || '')) + '</span>' + (an ? '<b class="jetztmarke">jetzt</b>' : '') + '</div>' +
      '<h2 class="kaptitel">' + (ph.stopp ? '✋' : (ART[ph.art] || '')) + ' ' + esc(ph.titel) + '</h2>' +
      (ph.stopp ? '<p class="stoppzeile">' + esc(ph.stoppText || 'Handys weg, alle schauen nach vorn.') + '</p>' : '') +
      (ph.html ? '<div class="unter">Darum geht’s</div>' + ph.html : '') + clipLinks(ph.clips) + '</div>';
    var haupt = [], mehr = [], pruefen = [], verdeckt = 0, hatTeam = false;
    k.bloecke.forEach(function (b) {
      if (b.team) hatTeam = true;
      if (!teamPasst(b)) { verdeckt++; return; }
      var ber = b.bereich || (MEHR[b.typ] ? 'mehr' : (b.typ === 'quiz' ? 'pruefen' : 'haupt'));
      (ber === 'mehr' ? mehr : (ber === 'pruefen' ? pruefen : haupt)).push(b);
    });
    if (hatTeam) {
      html += '<div class="filter teamfilter">' + (S.team ? '<button class="' + (S.werte.alleTeams ? '' : 'on') + '" data-alleteams="0">Nur Team ' + esc(S.team) + '</button><button class="' + (S.werte.alleTeams ? 'on' : '') + '" data-alleteams="1">Alle Teams</button>' + (verdeckt ? '<span class="leit">' + verdeckt + ' Aufträge anderer Teams ausgeblendet</span>' : '') :
        '<a class="btn klein sek" href="#/team">Team wählen, dann siehst du nur deinen Auftrag</a>') + '</div>';
    }
    var gesperrt = false;
    haupt.forEach(function (b) {
      if (gesperrt) return;
      html += mitBid(blockHtml(b, eid), b._bid);
      if (b.typ === 'freigabe' && !S.frei[b.id]) gesperrt = true;
    });
    if (gesperrt) html += '<div class="card gesperrt">🔒 Der Rest dieses Kapitels erscheint nach der Freigabe.</div>';
    else {
      if (mehr.length) {
        html += '<div class="card mehr"><div class="kicker">Zum Nachschlagen</div>';
        mehr.forEach(function (b) {
          mehrEintraege(b).forEach(function (m) { html += '<details data-dk="' + m[2] + '"><summary>' + esc(m[0]) + '</summary>' + mitBid(m[1], b._bid) + '</details>'; });
        });
        html += '</div>';
      }
      pruefen.forEach(function (b) { html += mitBid(blockHtml(b, eid), b._bid); });
      if (ph.ergebnis || ph.foto) html += '<div class="card ergebnis"><div class="kicker">Ergebnis</div>' + (ph.ergebnis ? '<p>' + ph.ergebnis + '</p>' : '') + (ph.foto ? '<div class="foto">📸 <b>Fotomoment (Rolle Dokumentation):</b> ' + esc(ph.foto) + '</div>' : '') + '</div>';
    }
    var liste = tagListe(), i = liste.indexOf(eid);
    var vor = n > 1 ? '<a class="btn sek" href="#/e/' + eid + '/' + (n - 1) + '">← zurück</a>' : '<a class="btn sek" href="#/e/' + eid + '">← Fahrplan</a>';
    var nach;
    if (n < e._kapN) nach = '<a class="btn" href="#/e/' + eid + '/' + (n + 1) + '">Weiter: ' + esc(kapitelNr(e, n + 1).phase.titel) + ' →</a>';
    else if (i < liste.length - 1) nach = '<a class="btn" href="#/e/' + liste[i + 1] + '">Geschafft. Weiter: ' + esc(etappen[liste[i + 1]].kurz) + ' →</a>';
    else nach = '<a class="btn" href="#/">Zur Missionskarte</a>';
    return html + '<div class="weiter">' + vor + nach + '</div></div>';
  }

  function laborSeite(id) {
    var html = '<div class="wrap step"><h2 style="margin:4px 0 10px">🔬 Labor</h2>';
    if (id && RECHNER[id]) return html + '<p><a href="#/labor">← alle Simulationen und Rechner</a></p>' + rechnerKarte(id) + '</div>';
    function liste(sim) {
      return '<div class="levels">' + Object.keys(RECHNER).filter(function (k) { return !!RECHNER[k].sim === sim; }).map(function (k) {
        var r = RECHNER[k];
        return '<a class="lv" href="#/labor/' + k + '"><span class="num">' + r.icon + '</span><span class="tx"><span class="tt" style="display:block">' + esc(r.titel) + '</span><span class="sub">' + esc(r.kurz) + '</span></span></a>';
      }).join('') + '</div>';
    }
    return html + '<h3 class="laborkopf">Simulationen</h3>' + liste(true) + '<h3 class="laborkopf">Rechner</h3>' + liste(false) + '</div>';
  }

  function logbuchSeite() {
    var html = '<div class="wrap step"><h2 style="margin:4px 0 6px">📓 Projektlogbuch</h2><p class="leit">' + esc(S.name || 'Name fehlt') + (S.team ? ', Team ' + esc(S.team) : '') + (S.rolle ? ', ' + esc(S.rolle) : '') + '</p>' +
      '<div class="reihe" style="margin-bottom:12px"><button class="btn" id="drucken">🖨️ Als PDF drucken</button><a class="btn sek" href="#/team">Profil</a></div>' + (P.logAbgabe ? '<div class="card merke">' + P.logAbgabe + '</div>' : '');
    P.jahre.forEach(function (j) {
      (j.etappen || []).forEach(function (eid) {
        var e = etappen[eid];
        if (!flach(e).some(function (b) { return b.typ === 'logbuch'; })) return;
        html += '<div data-bid="lb_' + eid + '">' + blockLogbuch({ titel: e.tag + ': ' + e.titel }, eid).replace('<div class="card">', '<div class="card">') + '</div>';
      });
    });
    return html + '</div>';
  }
  function drucken() {
    var d = document.getElementById('druck');
    var h = '<h1>Projektlogbuch ' + esc(P.titel) + '</h1><p>' + esc(S.name || '') + (S.team ? ', Team ' + esc(S.team) : '') + (S.rolle ? ', Rolle: ' + esc(S.rolle) : '') + ', gedruckt am ' + new Date().toLocaleDateString('de-DE') + '</p>';
    P.jahre.forEach(function (j) {
      (j.etappen || []).forEach(function (eid) {
        var e = etappen[eid], l = S.log[eid];
        if (!l) return;
        h += '<h2>' + esc(e.tag + ': ' + e.titel) + '</h2>' + P.logFragen.map(function (f, i) { return '<div class="eintrag"><b>' + esc(f) + '</b>' + esc(l[i] || '').replace(/\n/g, '<br>') + '</div>'; }).join('');
      });
    });
    var ris = riskEintraege();
    if (ris.length) h += '<h2>Risikomatrix (Rangfolge)</h2><ol>' + ris.sort(function (x, y) { return y.w * y.a - x.w * x.a; }).map(function (e) { return '<li>' + esc(e.k + ' ' + e.t) + ' (' + e.w * e.a + ')</li>'; }).join('') + '</ol>';
    d.innerHTML = h;
    document.body.classList.add('drucken');
    setTimeout(function () { window.print(); document.body.classList.remove('drucken'); }, 50);
  }

  function teamSeite() {
    var p = punkte();
    var html = '<div class="wrap step"><h2 style="margin:4px 0 10px">👥 Team und Profil</h2><div class="card"><h3>Dein Profil</h3>' + profilFelder() + '<p class="leit" style="margin-top:10px">Missionspunkte: ' + p + '. Punkte gibt es für erledigte Aufträge (10), Quizfragen im ersten Versuch (5), vollständige Logbucheinträge (10) und gelöste Fallakten (5).</p></div>';
    html += blockTeamwahl().replace(profilFelder(), '');
    html += '<div class="card"><h3>Rollen im Team</h3><p>Die Rollen wechseln jedes Jahr. So lernt jeder alle Seiten des Projekts kennen.</p><ul>' + P.rollen.map(function (r) { return '<li><b>' + esc(r.name) + ':</b> ' + esc(r.text) + '</li>'; }).join('') + '</ul></div>';
    html += '<div class="card"><h3>Teamvertrag</h3><p>Drei Regeln, auf die sich euer Team einigt.</p>' + [0, 1, 2].map(function (i) { return '<label class="feld" for="tv_' + i + '">Regel ' + (i + 1) + '</label><input type="text" id="tv_' + i + '" data-tv="' + i + '" value="' + esc(S.vertrag[i] || '') + '">'; }).join('') + '</div>';
    html += '<div class="card"><h3>So wird bewertet</h3><table class="tabelle"><thead><tr><th>Kriterium</th><th>Anteil</th><th>gut erfüllt, wenn</th></tr></thead><tbody>' + P.bewertung.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    html += '<div class="card"><h3>Speicher und Neustart</h3><p class="leit">Dein Fortschritt liegt nur auf diesem Gerät. Wechselst du das Gerät, beginnst du neu. Drucke dein Logbuch deshalb als PDF, bevor du etwas löschst.</p>' +
      '<div class="reihe"><button class="btn sek" id="reset_fortschritt">Fortschritt zurücksetzen</button><button class="btn sek" id="reset">Alles löschen</button></div>' +
      '<p class="leit" style="margin-top:8px">„Fortschritt zurücksetzen“ löscht Aufträge, Quiz, Fallakte, Freigaben, Messwerte und Notizen. Name, Team, Rolle, Teamvertrag und Logbuch bleiben. „Alles löschen“ setzt die App ganz auf Anfang.</p></div>';
    return html + '</div>';
  }

  function einzelSeite(typ) {
    var b = { typ: typ };
    var titel = { fallakte: '🔎 Fallakte', risiko: '⚠️ Risikomatrix', pitch: '🎤 Pitch' }[typ];
    return '<div class="wrap step"><h2 style="margin:4px 0 10px">' + titel + '</h2>' + blockHtml(b, 'x').replace(/^<div class="card/, '<div data-bid="x_' + typ + '" class="card') + '</div>';
  }

  /* ---------- Router ---------- */
  var TABS = [['#/', '🗺️', 'Mission'], ['#/labor', '🔬', 'Labor'], ['#/fallakte', '🔎', 'Fallakte'], ['#/logbuch', '📓', 'Logbuch'], ['#/team', '👥', 'Team']];
  function render() {
    var h = location.hash || '#/';
    var teile = h.replace(/^#\//, '').split('/');
    var html;
    if (teile[0] === 'e') html = teile[2] ? kapitelSeite(teile[1], +teile[2]) : tagSeite(teile[1]);
    else if (teile[0] === 'labor' || teile[0] === 'rechner') html = laborSeite(teile[1]);
    else if (teile[0] === 'logbuch') html = logbuchSeite();
    else if (teile[0] === 'team') html = teamSeite();
    else if (teile[0] === 'fallakte' || teile[0] === 'risiko' || teile[0] === 'pitch') html = einzelSeite(teile[0]);
    else html = startSeite();
    app.innerHTML = html;
    rechnerStarten(app);
    $$('[data-mt]', app).forEach(function (k) { if (!k.dataset.bid) k.dataset.bid = k.closest('[data-bid]') ? k.closest('[data-bid]').dataset.bid : ''; messDia(k); });
    $('#kopf').textContent = P.kurztitel;
    $('#tabs').innerHTML = TABS.map(function (t) {
      var on = (t[0] === '#/' ? (h === '#/' || h === '' || h.indexOf('#/e/') === 0) : h.indexOf(t[0]) === 0);
      return '<a href="' + t[0] + '" class="' + (on ? 'on' : '') + '"><span>' + t[1] + '</span>' + t[2] + '</a>';
    }).join('');
    kopfZeile();
  }
  window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });

  /* ---------- Ereignisse ---------- */
  app.addEventListener('click', function (ev) {
    var t = ev.target;
    if (quizKlick(ev)) return;
    var fo = t.closest('[data-fo]');
    if (fo) {
      var karte = fo.closest('[data-fall]'), cid = karte.dataset.fall;
      var st = S.fall[cid] || {};
      st[fo.dataset.fk] = +fo.dataset.fo;
      S.fall[cid] = st;
      if (st.u != null && st.m != null) toast('+5 Punkte, Karte in der Risikomatrix');
      speichern(); neuZeichnen(); return;
    }
    var fi = t.closest('[data-fi]');
    if (fi) { S.werte.fallfilter = fi.dataset.fi; speichern(); neuZeichnen(); return; }
    if (t.dataset.frei) {
      var inp = $('#code_' + t.dataset.frei);
      if (codeOk(inp.value)) { S.frei[t.dataset.frei] = true; speichern(); toast('Freigegeben'); neuZeichnen(); }
      else { inp.value = ''; toast('Code stimmt nicht'); }
      return;
    }
    if (t.dataset.wunsch != null) {
      var idx = +t.dataset.wunsch, andere = 1 - idx;
      S.wunsch[idx] = t.dataset.t;
      if (S.wunsch[andere] === t.dataset.t) S.wunsch[andere] = '';
      speichern(); neuZeichnen(); return;
    }
    if (t.dataset.ri === 'neu') {
      var tx = $('#ri_t').value.trim();
      if (!tx) { toast('Erst ein Risiko eintragen'); return; }
      S.eigen.push({ t: tx, w: +$('[data-fw="neu"][data-k="w"]').value, a: +$('[data-fw="neu"][data-k="a"]').value });
      speichern(); neuZeichnen(); return;
    }
    if (t.dataset.riweg != null) { S.eigen.splice(+t.dataset.riweg, 1); speichern(); neuZeichnen(); return; }
    if (t.id === 'drucken') { drucken(); return; }
    if (t.dataset.alleteams != null) { S.werte.alleTeams = t.dataset.alleteams === '1'; speichern(); neuZeichnen(); return; }
    if (t.dataset.weiche) { S.werte['st_' + t.dataset.weiche] = t.dataset.st; speichern(); neuZeichnen(); return; }
    if (t.dataset.idee === 'neu') {
      var it = $('#idee_neu').value.trim();
      if (!it) { toast('Erst eine Idee eintragen'); return; }
      S.werte.ideen = (S.werte.ideen || []).concat([it]);
      speichern(); neuZeichnen(); return;
    }
    if (t.dataset.ideeweg != null) { S.werte.ideen.splice(+t.dataset.ideeweg, 1); speichern(); neuZeichnen(); return; }
    if (t.id === 'reset') {
      if (confirm('Wirklich alles löschen? Auch Logbuch, Name und Team gehen verloren.')) { S = leer(); speichern(); render(); toast('App zurückgesetzt'); }
      return;
    }
    if (t.id === 'reset_fortschritt') {
      if (confirm('Fortschritt zurücksetzen? Name, Team, Rolle und Logbuch bleiben erhalten.')) {
        var neu = leer();
        ['name', 'team', 'rolle', 'wunsch', 'log', 'vertrag'].forEach(function (k) { neu[k] = S[k]; });
        S = neu; speichern(); render(); toast('Fortschritt zurückgesetzt');
      }
    }
  });
  app.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.dataset.done) {
      S.done[t.dataset.done] = t.checked;
      if (t.checked) toast('+10 Punkte');
      speichern(); neuZeichnen(); return;
    }
    if (t.dataset.fw && t.dataset.fw !== 'neu') {
      var st = S.fall[t.dataset.fw] || {};
      st[t.dataset.k] = +t.value;
      S.fall[t.dataset.fw] = st;
      speichern(); neuZeichnen(); return;
    }
    if (t.dataset.pf) { S[t.dataset.pf] = t.value; speichern(); if (t.dataset.pf === 'team') neuZeichnen(); return; }
    if (t.dataset.pc) { S.werte[t.dataset.pc] = t.checked; speichern(); return; }
  });
  app.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.dataset.log) {
      var l = S.log[t.dataset.log] || {};
      l[t.dataset.li] = t.value;
      S.log[t.dataset.log] = l;
      speichern(); return;
    }
    if (t.dataset.pf) { S[t.dataset.pf] = t.value; speichern(); return; }
    if (t.dataset.pitch != null) { S.pitch[t.dataset.pitch] = t.value; speichern(); return; }
    if (t.dataset.notiz) {
      var nw = S.werte['n_' + t.dataset.notiz] || {};
      nw[t.dataset.ni] = t.value;
      S.werte['n_' + t.dataset.notiz] = nw;
      speichern(); return;
    }
    if (t.dataset.fb) { S.feedback[t.dataset.fb] = t.value; speichern(); return; }
    if (t.dataset.tv != null) { S.vertrag[t.dataset.tv] = t.value; speichern(); return; }
    if (t.dataset.mk) {
      var karte = t.closest('[data-mt]');
      var bid = karte.dataset.mt;
      var w = S.werte['t_' + bid] || {};
      w[t.dataset.mk] = t.value;
      S.werte['t_' + bid] = w;
      speichern(); messDia(karte); return;
    }
  });
  function neuZeichnen() {
    var y = window.scrollY;
    var offen = $$('details[data-dk]', app).filter(function (d) { return d.open; }).map(function (d) { return d.dataset.dk; });
    render();
    offen.forEach(function (dk) { var d = $('details[data-dk="' + dk + '"]', app); if (d) d.open = true; });
    window.scrollTo(0, y);
  }

  render();
})();

</script>
</body>
</html>
