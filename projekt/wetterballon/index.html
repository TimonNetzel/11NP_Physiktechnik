  fallakte: [
    { id: 'F1', team: 'E', w: 2, a: 3, titel: 'Die Genehmigung dauert Wochen', quelle: '', clips: [[1, 278, 348]],
      text: 'Ein Wetterballon braucht eine Aufstiegserlaubnis der Luftfahrtbehörde. Die c’t-Redaktion warnt: Die Bearbeitung kann mehrere Wochen dauern.',
      ursache: { o: ['Die Behörde lehnt Schulprojekte grundsätzlich ab.', 'Der Antrag wird genau geprüft, oft mit Rückstau.', 'Ein Antrag ist erst nach dem Start nötig.'], r: 1, e: 'Die Behörde prüft Startort, Luftraum und Versicherung. Das braucht Zeit, besonders bei Rückständen.' },
      massnahme: { o: ['ohne Erlaubnis starten, falls sie zu spät kommt', 'den Antrag am Starttag telefonisch stellen', 'früh beantragen und ein Zeitfenster von zwei Wochen anmelden'], r: 2, e: 'Wir stellen den Antrag vor den Sommerferien 2028 und melden ein Zeitfenster an. So bleibt Spielraum für das Wetter.' } },
    { id: 'F2', team: 'E', w: 1, a: 3, titel: 'Startplatz in der Einflugschneise', quelle: '', clips: [[1, 189, 247]],
      text: 'Beim früheren Projekt lag der Startplatz in der Einflugschneise eines Rettungshubschraubers. Vor dem Start musste das Team bei der Leitstelle anrufen.',
      ursache: { o: ['Der Luftraum hat Besonderheiten, die man übersieht.', 'Der Ballon war für den Ort zu schwer.', 'Der Wind war am Starttag zu stark.'], r: 0, e: 'Die Behörde prüft die Koordinaten und erkennt Flugrouten, Kontrollzonen und Sperrgebiete, die man selbst leicht übersieht.' },
      massnahme: { o: ['Startplatz nach freier Sicht auswählen', 'nachts starten, weil dann niemand fliegt', 'Ort prüfen lassen, Auflagen notieren'], r: 2, e: 'Auflagen der Behörde wie ein Anruf bei der Leitstelle gehören als eigener Punkt in die Startcheckliste.' } },
    { id: 'F3', team: 'A', w: 2, a: 2, titel: 'Der Ballon fliegt länger als berechnet', quelle: '', clips: [[3, 283, 300], [3, 392, 417]],
      text: 'Berechnet waren 3 Stunden Flugzeit. Nach 3 Stunden war der Ballon noch in der Luft. Insgesamt flog er etwa 3,5 Stunden.',
      ursache: { o: ['Oben war der Wind stärker als erwartet.', 'Die Erde dreht sich unter dem Ballon weg.', 'Beim Füllen und Verschließen ist Gas entwichen.'], r: 2, e: 'Weniger Gas bedeutet weniger freien Auftrieb. Der Ballon steigt langsamer und braucht länger bis zur Platzhöhe. Der Wind verschiebt nur die Flugbahn, nicht die Flugdauer.' },
      massnahme: { o: ['mehr Gas einfüllen, ohne nachzumessen', 'freien Auftrieb mit Gewicht prüfen', 'Flugzeit vorsichtshalber verdoppeln'], r: 1, e: 'Den freien Auftrieb kann man am Boden prüfen. Hebt der verschlossene Ballon das Prüfgewicht nicht, wird nachgefüllt.' } },
    { id: 'F4', team: 'C', w: 2, a: 3, titel: 'Ein Kabel reißt kurz vor dem Start', quelle: '', clips: [[3, 192, 210]],
      text: 'Kurz vor dem Start reißt ein Kabel an der Sonde. Zum Glück hat das Team einen Lötkolben dabei.',
      ursache: { o: ['Es fehlte eine Zugentlastung.', 'Das Kabel war für den Strom zu dünn.', 'Die Kälte machte die Isolierung spröde.'], r: 0, e: 'Ohne Zugentlastung wirkt jede Bewegung direkt auf die Lötstelle. Kalt war es am Boden noch nicht.' },
      massnahme: { o: ['Zugentlastung und Lötkolben einplanen', 'Kabel außen an der Box festkleben', 'dickere Kabel ohne Steckverbinder nehmen'], r: 0, e: 'Jede Durchführung bekommt eine Zugentlastung als Abnahmekriterium. Für den Notfall liegt eine Starterkiste mit Gaslötkolben bereit.' } },
    { id: 'F5', team: 'D', w: 2, a: 3, titel: 'Das GPS fällt aus', quelle: '', clips: [[3, 331, 357], [4, 138, 192]],
      text: 'Nach einer Dreiviertelstunde kommen keine Positionen mehr. Temperatur und Druck werden weiter gesendet. Erst kurz vor dem Platzen kehrt das GPS zurück.',
      ursache: { o: ['Die GPS-Satelliten waren gerade abgeschaltet.', 'Feuchte oder fehlender Airborne-Modus', 'Der Ballon war für das Funksignal zu schnell.'], r: 1, e: 'Viele GPS-Module schalten oberhalb von 18 km ab, wenn der Airborne-Modus fehlt. Feuchte kann zusätzlich Kontakte stören.' },
      massnahme: { o: ['ein teureres GPS statt zwei Systemen', 'GPS-Antenne außen auf die Box kleben', 'Airborne-Modus testen, zweite Ortung'], r: 2, e: 'Zwei unabhängige Systeme mit eigener Stromversorgung machen den Ausfall eines Systems verkraftbar. Den Airborne-Modus prüfen wir im Test.' } },

    { id: 'F7', team: 'A', w: 3, a: 2, titel: 'Die Außentemperatur steigt in großer Höhe stark an', quelle: '', clips: [[4, 214, 258], [4, 437, 463]],
      text: 'Erst wird es mit der Höhe kälter. Dann steigt die gemessene Temperatur stark an. Ein Fühler in einem Schutzgehäuse misst deutlich tiefere Werte.',

      massnahme: { o: ['Fühler geschützt in die warme Box legen', 'Strahlungsschutz bauen und vergleichen', 'nur bei Nacht und Bewölkung fliegen'], r: 1, e: 'Ein Strahlungsschutz beschattet den Fühler und lässt Luft durch. Ihr baut ihn in Jahrgang 12 selbst.' } },
    { id: 'F8', team: 'C', w: 2, a: 2, titel: 'Der Backup-Tracker hat einen leeren Akku', quelle: '', clips: [[3, 494, 505], [4, 481, 497]],

      massnahme: { o: ['am Vortag laden, testen, abhaken', 'Tracker erst nach der Landung einschalten', 'auf das Backup ganz verzichten'], r: 0, e: 'Jedes Gerät bekommt eine eigene Zeile in der Startcheckliste: geladen, eingeschaltet, Position empfangen.' } },

      bloecke: [
        { typ: 'phase', art: 'plenum', sozial: 'plenum', von: '08:00', bis: '08:30', titel: 'Missionsbriefing',
          html: '<p>Im Herbst 2028 startet ein Wetterballon mit eurer Sonde. Er steigt in etwa zwei Stunden auf über 30 km Höhe. Dort ist der Luftdruck kleiner als 1 % des Bodendrucks, und es wird kälter als −50 °C. Dann platzt der Ballon, und die Sonde sinkt am Fallschirm zurück.</p>' +

          clips: [[3, 225, 280]],
          ergebnis: 'Fragen, die wir bis zum Flug klären müssen (Fragenspeicher an der Tafel)' },

        { typ: 'phase', art: 'team', sozial: 'team', von: '08:30', bis: '09:00', titel: 'Teams, Rollen und Sensor-Check',
          html: '<p>Wählt Erst- und Zweitwunsch. Die Lehrkraft gibt danach die Teams bekannt. Dann klärt ihr im Team Rollen, Regeln und eure Handys.</p>',
          ergebnis: 'Teams stehen, Rollen verteilt, jedes Team weiß, wer ein Handy mit Barometer hat' },
        { typ: 'teamwahl' },
        { typ: 'auftrag', id: 'a11_team', titel: 'Teamvertrag, Rollen und Sensor-Check',
          html: '<ol><li>Wer übernimmt in diesem Jahr welche Rolle? Tragt sie im Profil ein.</li><li>Auf welche drei Regeln einigt ihr euch? Tragt sie unter „Team“ beim Teamvertrag ein.</li><li>Installiert die kostenlose App phyphox. Öffnet die Kategorie „Sensoren“ und das Experiment „Luftdruck“. Erscheint ein Wert, hat das Handy ein Barometer. Jedes Team braucht mindestens ein solches Handy.</li></ol>' +
            '<div class="merke"><b>Fotoregeln:</b> Fotografiert vor allem Hände, Technik und Messkurven. Erkennbare Gesichter nur, wenn die Person einverstanden ist und eine Einwilligung vorliegt. Alle Fotos und Videos kommen in den Klassenordner, nicht in private Chats. Die Lehrkraft prüft alles, bevor es gezeigt wird.</div>',
          produkt: 'Rollen, Teamvertrag, Barometer-Handys im Team bekannt' },
        { typ: 'ideen', html: '<p>Am Samstag zeigen wir das Projekt am Tag der offenen Tür. Was soll dort passieren? Notiert eure Ideen hier und an der Ideenwand im Raum. Morgen um 12:00 Uhr stimmen wir ab. Die App speichert nur auf deinem Gerät, deshalb zählt die Ideenwand im Raum.</p>' },

        { typ: 'phase', art: 'rechnen', sozial: 'partner', von: '09:00', bis: '09:45', titel: 'Physikwerkstatt Atmosphäre',
          html: '<p>Lest den Text, rechnet mit dem Atmosphärenrechner und bearbeitet die Aufträge. Am Ende prüft das Quiz euer Wissen.</p>',
          ergebnis: 'Druck und Temperatur in drei Höhen, Quiz gelöst' },
        { typ: 'text', kicker: 'Wissen', titel: 'Die Atmosphäre in Schichten',
          html: '<p>Die <b>Troposphäre</b> reicht bis etwa 11 km. Dort findet das Wetter statt, und die Temperatur sinkt um etwa 6,5 K je Kilometer. Die Grenze heißt <b>Tropopause</b>. Darüber liegt die <b>Stratosphäre</b> bis etwa 50 km. In ihr bleibt die Temperatur zunächst gleich und steigt dann wieder an, weil Ozon UV-Strahlung der Sonne absorbiert.</p>' +
            '<div class="merke"><b>Merke:</b> Der Luftdruck entsteht durch das Gewicht der Luft darüber. Je höher man steigt, desto weniger Luft liegt darüber. In den unteren Kilometern halbiert sich der Druck etwa alle 5,5 km.</div>' +
            '<p>Die Normatmosphäre ist ein Modell mit festen Werten für Druck, Temperatur und Dichte. Mit ihr rechnen Luftfahrt und Wetterdienst. Ihr nutzt sie im Rechner unten.</p>' },
        { typ: 'rechner', ids: ['atmosphaere'] },
        { typ: 'auftrag', id: 'a11_atm', titel: 'Rechenaufträge Atmosphäre',
          html: '<ol><li>Bestimme Druck und Temperatur in 5,5 km, 11 km und 35,7 km Höhe.</li><li>In welcher Höhe beträgt der Druck nur noch 100 hPa? Gib den Druck unten im Rechner ein.</li><li>Wie viel Prozent der Bodendichte hat die Luft in 11 km Höhe noch?</li><li>Begründe in einem Satz, warum ein Temperaturfühler in 30 km Höhe schlecht abkühlt.</li></ol>' +
            '<div class="merke"><b>Für Schnelle: Wie hoch liegt unsere Schule?</b><br>Lest in phyphox („Luftdruck“) den Druck im Raum ab. Der Wetterbericht nennt den Druck umgerechnet auf Meereshöhe (die Lehrkraft schreibt den aktuellen Wert an). In Bodennähe gilt: 1 hPa Unterschied entspricht etwa 8,5 m. Schätzt die Höhe des Raums über dem Meer und vergleicht mit einer Karte.</div>',
          produkt: 'Ergebnisse im Heft oder im Logbuch notiert' },
        { typ: 'quiz', titel: 'Atmosphäre geprüft', fragen: [
          { id: 'q11_a1', f: 'Wie groß ist der Luftdruck in 11 km Höhe (Normatmosphäre)?', o: ['etwa 226 hPa', 'etwa 500 hPa', 'etwa 5 hPa'], r: 0, e: 'Etwa 226 hPa, also knapp ein Viertel des Bodendrucks von 1013 hPa. 500 hPa herrschen in etwa 5,5 km Höhe.' },
          { id: 'q11_a2', f: 'In welcher Höhe sind es nur noch 100 hPa?', o: ['etwa 5,5 km', 'etwa 40 km', 'etwa 16 km'], r: 2, e: 'Etwa 16,2 km. Ab hier liegt nur noch ein Zehntel der Luftmasse über dem Ballon.' },
          { id: 'q11_a3', f: 'Warum wird es oberhalb von etwa 20 km wieder wärmer?', o: ['Die Sonde ist dort näher an der Sonne.', 'Ozon nimmt UV-Strahlung auf und heizt die Luft.', 'Warme Luft vom Boden steigt auf und sammelt sich oben.'], r: 1, e: 'Die Ozonschicht nimmt UV-Strahlung auf und gibt die Energie als Wärme an die Luft ab. 30 km näher an der Sonne ändern bei 150 Millionen km Abstand nichts.' },

        ] },

        { typ: 'phase', art: 'pause', von: '09:45', bis: '10:00', titel: 'Pause' },

        { typ: 'phase', art: 'rechnen', sozial: 'partner', von: '10:00', bis: '10:45', titel: 'Physikwerkstatt Auftrieb und Ballon',
          html: '<p>Lest den Text, rechnet mit Gas- und Platzrechner und bearbeitet die Aufträge.</p>',
          ergebnis: 'Gasvolumen, Platzvolumen, Startvolumen und zwei Modellgrenzen' },
        { typ: 'text', kicker: 'Wissen', titel: 'Auftrieb und Ballon',
          html: '<p>Ein Körper in Luft erfährt eine Auftriebskraft. Sie ist so groß wie die Gewichtskraft der verdrängten Luft (Prinzip des Archimedes). Ist das Gas im Ballon leichter als die verdrängte Luft, steigt er.</p>' +
            '<p><span class="formel">F<sub>A</sub> = ρ<sub>Luft</sub> · V · g</span> und <span class="formel">F<sub>G,Gas</sub> = ρ<sub>Gas</sub> · V · g</span></p>' +
            '<div class="merke"><b>Merke:</b> Ein Kubikmeter Helium hebt am Boden bei 15 °C etwa 1,06 kg. Das ist die Differenz aus 1,225 kg/m³ (Luft) und 0,169 kg/m³ (Helium).</div>' +
            '<p>Beim Aufstieg sinkt der Außendruck. Das Gas im Ballon dehnt sich aus, bis die Hülle reißt. Die Hersteller geben dafür einen Platzdurchmesser an. Der Ballon der c’t platzte bei etwa 12,5 m Durchmesser.</p>' },
        { typ: 'rechner', ids: ['gas', 'platzen'] },
        { typ: 'auftrag', id: 'a11_gas', titel: 'Rechenaufträge Ballon',
          html: '<ol><li>Berechne mit den Beispielwerten im Gasrechner das nötige Gasvolumen. Die Sonde wiegt wie bei der c’t 1,6 kg.</li><li>Berechne das Volumen des Ballons beim Platzen (Durchmesser 12,5 m).</li><li>Probiere im Platzrechner, mit wie viel Gas am Start der Ballon in 35,7 km platzt.</li><li>Die c’t füllte höchstens 5,5 m³ ein. Nenne zwei Gründe, warum unser Modell davon abweicht.</li></ol>' +
            '<div class="merke"><b>Für Schnelle:</b> Was passiert mit Gasvolumen und Platzhöhe, wenn ihr den freien Auftrieb von 1500 g auf 2500 g erhöht? Begründet mit den beiden Rechnern.</div>',
          produkt: 'Ergebnisse im Heft oder im Logbuch notiert' },
        { typ: 'quiz', titel: 'Ballon geprüft', fragen: [
          { id: 'q11_b1', f: 'Wie groß ist das Volumen eines Ballons mit 12,5 m Durchmesser?', o: ['etwa 100 m³', 'etwa 10 000 m³', 'etwa 1000 m³'], r: 2, e: 'V = 4/3 · π · (6,25 m)³ ≈ 1023 m³.' },
          { id: 'q11_b2', f: 'Wie viel Gas braucht der Ballon nach unserem Modell am Start, um in 35,7 km zu platzen?', o: ['etwa 6 m³', 'etwa 1 m³', 'etwa 60 m³'], r: 0, e: 'Etwa 6,1 m³. Das Volumen wächst bis zum Platzen etwa um das 170-Fache.' },
          { id: 'q11_b3', f: 'Beim Füllen entweicht etwas Gas. Was passiert?', o: ['Er steigt schneller, weil er leichter ist.', 'Er steigt nicht mehr, weil der Auftrieb fehlt.', 'Er steigt langsamer und platzt höher.'], r: 2, e: 'Weniger freier Auftrieb heißt langsamerer Aufstieg. Mit weniger Gas erreicht die Hülle ihren Platzdurchmesser außerdem erst in größerer Höhe. Solange noch freier Auftrieb übrig ist, steigt er weiter.' }
        ] },

        { typ: 'phase', art: 'video', sozial: 'team', von: '10:45', bis: '11:35', titel: 'Fallakte c’t mit Videoausschnitten',
          html: '<ol><li><b>10:45–10:55 Video:</b> Wählt unten euer Team. Schaut auf einem Handy oder iPad die Ausschnitte zu euren Karten, mit Kopfhörern oder leise. Die roten Knöpfe springen direkt an die richtige Stelle.</li><li><b>10:55–11:10 Karten:</b> Bestimmt Ursache und Gegenmaßnahme und schätzt Wahrscheinlichkeit und Auswirkung ein.</li><li><b>11:10–11:35 Plenum:</b> Jedes Team zeigt einen Ausschnitt von 30 Sekunden und stellt seine Karten in zwei Minuten vor. Danach entsteht die gemeinsame Risikomatrix.</li></ol>',
          ergebnis: 'Risikomatrix v1 mit allen Karten und mindestens einem eigenen Risiko',
          foto: 'Bildschirmfoto der fertigen Risikomatrix' },
        { typ: 'fallakte', titel: 'Was ging bei den Profis schief?',
          html: '<div class="merke"><b>Für Schnelle:</b> Bearbeitet eine Karte eines anderen Teams und vergleicht eure Einschätzung.</div>' },
        { typ: 'stopp', titel: '11:10 Uhr: Teams stellen ihre Karten vor', html: '<p>Handys weg, alle schauen nach vorn. Jedes Team zeigt einen Ausschnitt von 30 Sekunden und nennt Ursache, Gegenmaßnahme und Risiko seiner Karten.</p>' },
        { typ: 'risiko', titel: 'Risikomatrix v1',
          html: '<p>Jede gelöste Karte erscheint hier. Ergänzt mindestens ein eigenes Risiko für unsere Sonde.</p>' },

        { typ: 'phase', art: 'pause', von: '11:35', bis: '12:05', titel: 'Mittagspause' },

        { typ: 'phase', art: 'bauen', sozial: 'team', von: '12:05', bis: '13:25', titel: 'Werkstatt Isolierbox',
          html: '<p>Zum Start zeigt die Lehrkraft zwei kurze Ausschnitte (2 min): warum die c’t eine Styroporbox nimmt und was die Kälte mit den Kameras gemacht hat. Danach folgen Sicherheitsunterweisung und Bau.</p>',
          clips: [[2, 41, 66], [4, 258, 284]],
          ergebnis: 'Box mit Deckel und Fühlerloch, Masse in g',
          foto: 'Zuschnitt (Hände und Cutter) und die fertigen Boxen auf der Waage' },
        { typ: 'freigabe', id: 'f_werkstatt', titel: 'Werkstatt Isolierbox',
          html: '<p>Bevor ihr schneidet, gibt es eine Sicherheitsunterweisung.</p><ul><li>Cutter nur mit Stahllineal und Schneidmatte, immer vom Körper weg schneiden.</li><li>Den Heißdraht bedient nur, wer dafür eingewiesen ist. Fenster auf.</li><li>Wasser für den Kältetest höchstens 40 °C.</li></ul>' },
        { typ: 'auftrag', id: 'a11_box', titel: 'Baut eure Isolierbox',
          html: '<p>Jedes Team baut eine Box mit dem <b>Innenmaß 12 cm × 12 cm × 12 cm</b>. Darin steht morgen draußen eine 250-ml-Flasche mit warmem Wasser als Ersatz für die Elektronik. Jedes Team verändert genau eine Größe:</p>' +
            '<table class="tabelle"><thead><tr><th>Team</th><th>Variante</th></tr></thead><tbody><tr><td>A</td><td>XPS 20 mm, zwei gleiche Boxen. Eine steht morgen im Fahrtwind eines Ventilators.</td></tr><tr><td>B</td><td>XPS 30 mm</td></tr><tr><td>C</td><td>EPS 30 mm</td></tr><tr><td>D</td><td>XPS 20 mm, innen mit Rettungsdecke ausgekleidet</td></tr><tr><td>E</td><td>Wellpappe als Vergleich. Danach hilft Team E bei der zweiten Box von Team A.</td></tr></tbody></table>' +
            '<p><b>Zuschnittplan</b> (Plattenmaße in cm, je Teil zweimal). Alle Fugen außer bei Team E mit Gewebeband schließen.</p>' +
            '<table class="tabelle"><thead><tr><th>Wand</th><th>Boden und Deckel</th><th>vorne und hinten</th><th>links und rechts</th></tr></thead><tbody><tr><td>20 mm</td><td>16 × 16</td><td>16 × 12</td><td>12 × 12</td></tr><tr><td>30 mm</td><td>18 × 18</td><td>18 × 12</td><td>12 × 12</td></tr><tr><td>Pappe</td><td>13 × 13</td><td>13 × 12</td><td>12 × 12</td></tr></tbody></table>' +
            '<ol><li>Teile anzeichnen und schneiden (30 min).</li><li>Fügen, Fugen schließen, Deckel mit Loch für den Fühler (30 min).</li><li>Box mit der Küchenwaage wiegen, Masse und Team auf die Box schreiben (10 min).</li></ol>' +
            '<div class="merke"><b>Für Schnelle:</b> Berechnet das Volumen des Dämmstoffs und daraus mit der Dichte (XPS etwa 33 kg/m³, EPS etwa 20 kg/m³) die erwartete Masse. Vergleicht mit der Waage.</div>',
          produkt: 'Box mit Deckel und Fühlerloch, Masse in g' },

        { typ: 'phase', art: 'schreiben', sozial: 'gemischt', von: '13:25', bis: '14:00', titel: 'Prüfauftrag, Logbuch und Messung über Nacht',
          html: '<ol><li>Prüfauftrag im Team (12 min)</li><li>Messung über Nacht vergeben (5 min)</li><li>Exit-Quiz (3 min)</li><li>Logbuch, jeder für sich (15 min)</li></ol>',
          ergebnis: 'Prüfauftrag, Logbucheintrag, Druckmessung läuft' },
        { typ: 'notiz', id: 'n11_pa', titel: 'Prüfauftrag für den Kältetest',
          html: '<p>Der Kältetest läuft morgen draußen unter dem Vordach. Alle Boxen stehen nebeneinander, dazu eine Flasche ohne Box und ein Thermometer für die Außenluft. Formuliert den Prüfauftrag so eindeutig wie in Woche 1 von 11.1.</p>',
          felder: ['Objekt und Messgröße', 'Messmittel und Messstelle', 'Ablauf (Starttemperatur, Ableseabstand, Dauer)', 'Entscheidungskriterium: Wann ist eine Box gut genug?', 'Hypothese: Welche Box dämmt am besten, und was macht der Fahrtwind?'] },
        { typ: 'auftrag', id: 'a11_druck24', titel: 'Luftdruck über Nacht messen',
          html: '<p>Je Team nimmt ein Schüler mit Barometer-Handy die Messung mit nach Hause.</p><ol><li>Zu Hause phyphox öffnen, Kategorie „Sensoren“, Experiment „Luftdruck“, Start drücken.</li><li>Handy flach hinlegen und bis morgen früh nicht bewegen. Nicht in ein anderes Stockwerk tragen.</li><li>Ladekabel anschließen, die automatische Bildschirmsperre ausschalten, phyphox im Vordergrund lassen.</li><li>Morgens stoppen, die Kurve als Bildschirmfoto sichern oder die Daten als CSV exportieren und in den Klassenordner legen.</li></ol><p class="leit">phyphox speichert dabei nur den Luftdruck, keinen Standort.</p>',
          produkt: 'Druckkurve von Donnerstag bis Freitag im Klassenordner' },
        { typ: 'quiz', kicker: 'Exit', titel: 'Was nehmt ihr mit?', fragen: [
          { id: 'q11_x1', f: 'Welche Aussage über die Isolierbox stimmt?', o: ['Die dickste Wand ist für die Mission immer am besten.', 'Dämmung kostet Masse, gesucht ist ein Kompromiss.', 'Die Box muss luftdicht verschlossen sein.'], r: 1, e: 'Jedes Gramm muss der Ballon heben. Luftdicht darf die Box übrigens nicht sein, sonst misst der Drucksensor falsch.' },
          { id: 'q11_x2', f: 'Warum braucht die Sonde ein kleines Loch für den Druckausgleich?', o: ['damit die Kamera durch das Loch filmen kann', 'damit Regenwasser aus der Box ablaufen kann', 'damit der Drucksensor den echten Außendruck misst'], r: 2, e: 'Innen und außen soll derselbe Druck herrschen. Sonst misst der Sensor falsch, und die Box könnte durch Überdruck aufplatzen.' }
        ] },
        { typ: 'logbuch', titel: 'Logbuch Tag 1' },
        { typ: 'checkliste', id: 'cl11_t1', titel: 'Bevor du gehst (Tag 1)', punkte: ['Box ist gewogen und mit Team und Masse beschriftet.', 'Prüfauftrag ist ausgefüllt.', 'Die Messung über Nacht läuft bei einem Schüler unseres Teams.', 'Fotos von heute liegen im Klassenordner.', 'Meine Idee für Samstag steht an der Ideenwand.', 'Mein Logbuch für Tag 1 ist vollständig.'] },
        { typ: 'freigabe', id: 'f_pruefauftrag', titel: 'Prüfauftrag kontrolliert',

    /* ================= Jahrgang 11, Tag 2 (Freitag) Vormittag ================= */
    { id: 'j11t2', icon: '🧊', tag: 'Jahrgang 11, Tag 2 bis 10:50 Uhr', titel: 'Messen und Konstruieren', kurz: 'Tag 2 Vormittag', untertitel: 'Kältetest draußen, Halter von Hand, Treppenhaus und Fallschirm mit phyphox',

            '<div class="warn">Ventilator und Verlängerungskabel bleiben trocken und liegen nicht in Pfützen. Bei Regen stehen alle Boxen unter dem Dach.</div>' +

        { typ: 'phase', art: 'messen', sozial: 'paare', von: '08:20', bis: '10:00', titel: 'Stationen in zwei Runden',
          html: '<p>Jedes Team teilt sich in zwei Paare. Ein Paar startet an Station A, das andere an Station B. Um 09:10 Uhr wird gewechselt. Station A baut in Runde 2 auf der Zeichnung aus Runde 1 auf. Der Kältetest läuft bis 09:35 Uhr weiter.</p>',

        { typ: 'stationen', id: 'st11', titel: 'Wo startet euer Paar?', runden: ['08:20–09:10', '09:10–10:00'],
          html: '<p>Wählt eure Startstation. Die App zeigt euch danach beide Runden in der richtigen Reihenfolge.</p>',
          stationen: {
            A: { titel: 'Halter von Hand konstruieren',
              r1: [
                { typ: 'auftrag', id: 'a11_zeichnen', kicker: 'Station A, Runde 1', titel: 'Halter zeichnen',
                  html: '<p>Die Sensorplatine soll später fest in der Sondenwand sitzen. Zeichnet einen Halter, der in eine 20 mm dicke Styroporwand gesteckt wird. Als Muster liegt an der Station eine Sensorplatine.</p>' +
                    '<div class="task"><b>Anforderungen</b><ul><li>Masse höchstens 8 g, wenn der Halter später aus PLA gedruckt wird</li><li>Platine sitzt formschlüssig, Sensor bleibt frei zur Luft</li><li>Halter hält in der Styroporwand, ohne zu wackeln</li></ul></div>' +

            B: { titel: 'Treppenhaus und Fallschirm mit phyphox', r1: STATION_B, r2: STATION_B }
          } },

        { typ: 'phase', art: 'pause', von: '10:00', bis: '10:15', titel: 'Pause' },

        { typ: 'phase', art: 'rechnen', sozial: 'team', von: '10:15', bis: '10:50', titel: 'Auswertung',
          html: '<p>Zum Start zeigt die Lehrkraft die Temperaturkurve aus dem echten Flug (1 min). Teilt die Auswertung im Team auf, jeder übernimmt einen Punkt. Danach tragt ihr die Kernaussagen zusammen.</p><ol><li>Kältetest: Temperaturabfall nach 60 min je Box, dazu die Boxmasse an der Tafel. Welche Box ist der beste Kompromiss?</li><li>Fahrtwind: Wie viel schneller kühlt die Box im Wind ab?</li><li>Flasche ohne Box: Wie viel bringt die Dämmung überhaupt?</li><li>Treppenhaus und Fallschirm: Höhen und Sinkgeschwindigkeit mit der Rechnung vergleichen.</li><li>Luftdruck über Nacht: Um wie viel hPa hat sich der Druck geändert? Welche Höhe würde ein Logger daraus fälschlich berechnen? Warum liegen die Kurven der Teams verschieden hoch?</li></ol>',

          { id: 'q11_t2', f: 'Box A kühlt in 60 min um 8 K ab und wiegt 90 g. Box B kühlt um 6 K ab und wiegt 210 g. Welche nehmen wir?', o: ['Box A, weil sie leichter ist.', 'Box B, weil sie besser dämmt.', 'Das hängt vom Massebudget ab.'], r: 2, e: 'Box B dämmt besser, kostet aber 120 g mehr. Ob sich das lohnt, entscheidet das Massebudget. Ein Kriterium allein reicht nicht.' },

    { id: 'j11tdot', icon: '🏫', tag: 'Jahrgang 11, Samstag', titel: 'Tag der offenen Tür', kurz: 'Samstag', untertitel: 'Präsentation, Film, drei Mitmachstationen und Gespräche',
      ziele: ['die Mission in 30 Sekunden verständlich erklären', 'eine Mitmachstation sicher betreuen'],
      bloecke: [
        { typ: 'phase', art: 'bauen', sozial: 'team', titel: 'Aufbau vor dem Einlass (30 min)',
          html: '<ol><li>Großer Bildschirm: Endlos-Präsentation im Wechsel mit dem Kurzfilm.</li><li>Drei Stationen aufbauen (siehe unten), Schichtplan aushängen.</li><li>QR-Code zur App gut sichtbar aufstellen.</li><li>Fernzugriff von phyphox im Raum testen.</li></ol>',
          ergebnis: 'Stand steht, Fernzugriff läuft' },

            '<div class="stationen">' +

</script>
<script>
/* Projekt-App: Engine (Missionskarte, Etappen mit Blöcken, Rechner, Fallakte, Risikomatrix, Pitch, Logbuch).
   Inhalt kommt aus PROJEKT (inhalt.js), CONFIG kommt vom Builder (codeHash, erzeugt). */
(function () {
  'use strict';
  var P = PROJEKT;
  var KEY = 'projekt_' + P.id;
  var app = document.getElementById('app');

  /* ---------- Zustand ---------- */
  function leer() {
    return { name: '', team: '', rolle: '', wunsch: ['', ''], done: {}, quiz: {}, log: {}, fall: {}, eigen: [], frei: {}, werte: {}, masse: null, pitch: {}, vertrag: {}, feedback: {} };
  }
  var S = leer();
  try {
    var roh = localStorage.getItem(KEY);
    if (roh) { var gel = JSON.parse(roh); for (var k in gel) S[k] = gel[k]; }
  } catch (e) { /* privat oder gesperrt: ohne Speicher weiter */ }
  function speichern() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ohne Speicher */ }
    kopfZeile();
  }

  /* ---------- Hilfen ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function zahl(v) { var x = parseFloat(String(v).replace(',', '.')); return isFinite(x) ? x : NaN; }
  function fmt(x, d) {
    if (!isFinite(x)) return '–';
    var s = x.toFixed(d == null ? 2 : d).replace('.', ',');
    if (s.charAt(0) === '-') s = '\u2212' + s.slice(1);
    var teile = s.split(',');
    teile[0] = teile[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return teile.join(',');
  }
  function $(sel, el) { return (el || document).querySelector(sel); }
  function $$(sel, el) { return Array.prototype.slice.call((el || document).querySelectorAll(sel)); }
  function toast(t) {
    var d = document.createElement('div');
    d.className = 'toast'; d.textContent = t;
    document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 1800);
  }
  function hash(s) {
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return ('00000000' + h.toString(16)).slice(-8);
  }
  function codeOk(eingabe) {
    eingabe = String(eingabe || '').trim();
    if (!eingabe) return false;
    if (!CONFIG.codeHash) return true;
    return hash(eingabe) === CONFIG.codeHash;
  }

  /* ---------- Punkte und Ränge ---------- */
  function punkte() {
    var p = 0, k;
    for (k in S.done) if (S.done[k]) p += 10;
    for (k in S.quiz) if (S.quiz[k] && S.quiz[k].erst) p += 5;
    for (k in S.log) if (logVoll(k)) p += 10;
    for (k in S.fall) if (S.fall[k] && S.fall[k].u != null && S.fall[k].m != null) p += 5;
    return p;
  }
  function rang(p) {
    var r = P.raenge[0];
    P.raenge.forEach(function (x) { if (p >= x.ab) r = x; });
    return r;
  }
  function kopfZeile() {
    var p = punkte();
    $('#punkte').textContent = p + ' P';
  }
  function logVoll(eid) {
    var l = S.log[eid];
    if (!l) return false;
    var n = 0;
    for (var k in l) if (String(l[k]).trim().length > 15) n++;
    return n >= 3;
  }

  /* ---------- Normatmosphäre ---------- */
  var G0 = 9.80665, RL = 287.053;
  var SCH = [[0, 288.15, -0.0065, 101325], [11000, 216.65, 0, 0], [20000, 216.65, 0.001, 0], [32000, 228.65, 0.0028, 0], [47000, 270.65, 0, 0]];
  (function () {
    for (var i = 1; i < SCH.length; i++) {
      var a = SCH[i - 1], h1 = SCH[i][0];
      SCH[i][3] = a[2] === 0 ? a[3] * Math.exp(-G0 * (h1 - a[0]) / (RL * a[1])) : a[3] * Math.pow(1 + a[2] * (h1 - a[0]) / a[1], -G0 / (a[2] * RL));
    }
  })();
  function atm(h) {
    h = Math.max(0, Math.min(h, 50000));
    var i = SCH.length - 1;
    while (i > 0 && h < SCH[i][0]) i--;
    var s = SCH[i], T = s[1] + s[2] * (h - s[0]);
    var p = s[2] === 0 ? s[3] * Math.exp(-G0 * (h - s[0]) / (RL * s[1])) : s[3] * Math.pow(1 + s[2] * (h - s[0]) / s[1], -G0 / (s[2] * RL));
    return { p: p, T: T, rho: p / (RL * T) };
  }
  function hoeheAusDruck(p) {
    var lo = 0, hi = 50000;
    for (var i = 0; i < 60; i++) { var m = (lo + hi) / 2; if (atm(m).p > p) lo = m; else hi = m; }
    return lo;
  }
  var RHO_L = 101325 / (RL * 288.15);
  var RHO_HE = 101325 * 0.0040026 / (8.314462 * 288.15);

  /* ---------- Diagramm ---------- */
  function diagramm(reihen, o) {
    var W = 640, H = 300, L = 58, R = 14, T = 14, B = 44;
    var xs = [], ys = [];
    reihen.forEach(function (r) { r.punkte.forEach(function (q) { if (isFinite(q[0]) && isFinite(q[1])) { xs.push(q[0]); ys.push(q[1]); } }); });
    if (!xs.length) return '<p class="leit">Noch keine Messwerte.</p>';
    var x0 = o.x0 != null ? o.x0 : Math.min.apply(null, xs), x1 = o.x1 != null ? o.x1 : Math.max.apply(null, xs);
    var y0 = o.y0 != null ? o.y0 : Math.min.apply(null, ys), y1 = o.y1 != null ? o.y1 : Math.max.apply(null, ys);
    if (x1 === x0) x1 = x0 + 1;
    if (y1 === y0) { y1 = y0 + 1; y0 = y0 - 1; }
    function X(v) { return L + (v - x0) / (x1 - x0) * (W - L - R); }
    function Y(v) { return H - B - (v - y0) / (y1 - y0) * (H - T - B); }
    var g = '';
    for (var i = 0; i <= 5; i++) {
      var vx = x0 + (x1 - x0) * i / 5, vy = y0 + (y1 - y0) * i / 5;
      g += '<line x1="' + X(vx) + '" y1="' + T + '" x2="' + X(vx) + '" y2="' + (H - B) + '" stroke="#e3e9f1"/>';
      g += '<line x1="' + L + '" y1="' + Y(vy) + '" x2="' + (W - R) + '" y2="' + Y(vy) + '" stroke="#e3e9f1"/>';
      g += '<text x="' + X(vx) + '" y="' + (H - B + 18) + '" font-size="13" text-anchor="middle" fill="#4d5a6b">' + fmt(vx, o.dx || 0) + '</text>';
      g += '<text x="' + (L - 6) + '" y="' + (Y(vy) + 4) + '" font-size="13" text-anchor="end" fill="#4d5a6b">' + fmt(vy, o.dy || 0) + '</text>';
    }
    g += '<text x="' + ((L + W - R) / 2) + '" y="' + (H - 6) + '" font-size="14" text-anchor="middle" fill="#132033">' + esc(o.xl) + '</text>';
    g += '<text x="14" y="' + ((T + H - B) / 2) + '" font-size="14" text-anchor="middle" fill="#132033" transform="rotate(-90 14 ' + ((T + H - B) / 2) + ')">' + esc(o.yl) + '</text>';
    var farben = ['#c2410c', '#17607a', '#1b7a47', '#5b3fc4', '#a86d1c', '#7a1d2e'];
    reihen.forEach(function (r, j) {
      var f = r.farbe || farben[j % farben.length];
      var pts = r.punkte.filter(function (q) { return isFinite(q[0]) && isFinite(q[1]); });
      if (pts.length > 1 && !r.nurPunkte) g += '<polyline fill="none" stroke="' + f + '" stroke-width="3" points="' + pts.map(function (q) { return X(q[0]).toFixed(1) + ',' + Y(q[1]).toFixed(1); }).join(' ') + '"/>';
      if (r.marken || r.nurPunkte) pts.forEach(function (q) { g += '<circle cx="' + X(q[0]) + '" cy="' + Y(q[1]) + '" r="5" fill="' + f + '"/>'; });
    });
    if (o.legende) g += reihen.map(function (r, j) { return '<text x="' + (L + 10) + '" y="' + (T + 16 + 18 * j) + '" font-size="13" font-weight="700" fill="' + (r.farbe || farben[j % farben.length]) + '">' + esc(r.name) + '</text>'; }).join('');
    return '<svg class="diagramm" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.yl + ' gegen ' + o.xl) + '">' + g + '</svg>';
  }

  /* ---------- Eingabefelder für Rechner ---------- */
  function feld(id, label, wert, einheit, schritt) {
    return '<div><label class="feld" for="' + id + '">' + esc(label) + (einheit ? ' in ' + esc(einheit) : '') + '</label><input type="number" inputmode="decimal" id="' + id + '" value="' + wert + '" step="' + (schritt || 'any') + '"></div>';
  }
  function werteMerken(rid, el) {
    var w = S.werte['r_' + rid] || {};
    $$('input,select', el).forEach(function (i) { if (i.id && w[i.id] != null) i.value = w[i.id]; });
    el.addEventListener('input', function () {
      var neu = {};
      $$('input,select', el).forEach(function (i) { if (i.id) neu[i.id] = i.value; });
      S.werte['r_' + rid] = neu;
      speichern();
    });
  }
  function v(el, id) { return zahl($('#' + id, el).value); }

  /* ---------- Rechner ---------- */
  var RECHNER = {
    atmosphaere: {
      titel: 'Atmosphäre', icon: '🌡️', kurz: 'Druck, Temperatur und Dichte in jeder Höhe (Normatmosphäre)',
      html: function () {
        return '<label class="feld" for="a_hr">Schieberegler für die Höhe (0 bis 45 km)</label><input type="range" id="a_hr" min="0" max="45" step="0.1" value="11">' +
          '<div class="rgrid">' + feld('a_h', 'Höhe', '11', 'km') + feld('a_p', 'oder Druck eingeben', '', 'hPa') + '</div>' +
          '<div class="erg" id="a_erg"></div><div id="a_dia"></div>' +
          '<p class="leit">Modell: internationale Normatmosphäre. Echte Werte schwanken mit Wetter, Jahreszeit und Ort.</p>';
      },
      init: function (el) {
        function rechne(h) {
          var a = atm(h * 1000);
          $('#a_erg', el).innerHTML = '<div>Luftdruck<b>' + fmt(a.p / 100, a.p < 1000 ? 2 : 0) + ' hPa</b></div><div>Temperatur<b>' + fmt(a.T - 273.15, 1) + ' °C</b></div><div>Luftdichte<b>' + fmt(a.rho, 3) + ' kg/m³</b></div><div>Anteil vom Bodendruck<b>' + fmt(a.p / 1013.25, 1) + ' %</b></div>';
          var pT = [], pp = [];
          for (var x = 0; x <= 45; x += 0.5) { var b = atm(x * 1000); pT.push([b.T - 273.15, x]); pp.push([b.p / 100, x]); }
          $('#a_dia', el).innerHTML = diagramm([{ name: 'Temperatur', punkte: pT }, { name: 'Ballon', punkte: [[a.T - 273.15, h]], nurPunkte: true, farbe: '#c2410c' }], { xl: 'Temperatur in °C', yl: 'Höhe in km', x0: -70, x1: 20, y0: 0, y1: 45 });
        }
        var hr = $('#a_hr', el), hf = $('#a_h', el), pf = $('#a_p', el);
        hr.addEventListener('input', function () { hf.value = hr.value; pf.value = ''; rechne(zahl(hr.value)); });
        hf.addEventListener('input', function () { var h = zahl(hf.value); if (isFinite(h)) { hr.value = h; pf.value = ''; rechne(h); } });
        pf.addEventListener('input', function () { var p = zahl(pf.value); if (isFinite(p) && p > 0) { var h = hoeheAusDruck(p * 100) / 1000; hf.value = h.toFixed(2); hr.value = h; rechne(h); } });
        rechne(zahl(hf.value) || 0);
      }
    },
    gas: {
      titel: 'Ballongas', icon: '🎈', kurz: 'Wie viel Gas muss in den Ballon?',
      html: function () {
        return '<div class="rgrid">' + feld('g_mb', 'Masse Ballonhülle', 1200, 'g') + feld('g_ms', 'Masse Sonde', 1600, 'g') + feld('g_mf', 'Fallschirm und Schnur', 200, 'g') + feld('g_fl', 'freier Auftrieb', 1500, 'g') + feld('g_x', 'Heliumanteil im Ballongas', 100, '%') + '</div>' +
          '<div class="erg" id="g_erg"></div>' +
          '<div class="merke"><b>So rechnet die App:</b> Jeder Kubikmeter Gas hebt die Differenz der Dichten. <span class="formel">V = m<sub>gesamt</sub> / (ρ<sub>Luft</sub> − ρ<sub>Gas</sub>)</span>. Am Boden bei 15 °C ist ρ<sub>Luft</sub> = 1,225 kg/m³ und ρ<sub>He</sub> = 0,169 kg/m³. Der freie Auftrieb ist der Überschuss, der den Ballon nach oben zieht.</div>';
      },
      init: function (el) {
        function rechne() {
          var m = (v(el, 'g_mb') + v(el, 'g_ms') + v(el, 'g_mf') + v(el, 'g_fl')) / 1000;
          var x = v(el, 'g_x') / 100;
          var d = x * (RHO_L - RHO_HE);

  function blockPitch(b) {

  function blockFeedback(b) {

  function blockText(b) {

  /* ---------- Videos ---------- */
  function zeitText(s) { var m = Math.floor(s / 60), x = s % 60; return m + ':' + (x < 10 ? '0' : '') + x; }
  function clipLinks(clips) {

  /* ---------- Phasen, Fahrplan, Stopp ---------- */
  var ART = { video: '🎬', lesen: '📖', rechnen: '🧮', messen: '🔬', bauen: '🛠️', plenum: '🗣️', pause: '☕', schreiben: '✍️', team: '👥', praesentieren: '🎤' };

  function uhrJetzt() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function blockPhase(b, nr, gesamt) {
    if (b.art === 'pause') return '<div class="card phase pausekarte" id="' + b._anker + '"><b>☕ ' + esc(b.titel || 'Pause') + '</b> ' + (b.von ? esc(b.von) + '–' + esc(b.bis) + ' Uhr' : '') + '</div>';
    return '<div class="card phase" id="' + b._anker + '"><div class="phkopf"><span class="phnr">Phase ' + nr + ' von ' + gesamt + '</span>' + (b.von ? '<span class="zeit">' + esc(b.von) + '–' + esc(b.bis) + '</span>' : '') + (b.sozial ? '<span class="chip">' + esc(SOZIAL[b.sozial] || b.sozial) + '</span>' : '') + '</div>' +
      '<h3>' + (ART[b.art] || '') + ' ' + esc(b.titel) + '</h3>' + (b.html || '') + clipLinks(b.clips) +
      (b.ergebnis ? '<div class="produkt"><b>Ergebnis der Phase:</b> ' + b.ergebnis + '</div>' : '') +
      (b.foto ? '<div class="foto">📸 <b>Fotomoment (Rolle Dokumentation):</b> ' + esc(b.foto) + '</div>' : '') + '</div>';
  }
  function fahrplan(e) {
    var ph = phasenVon(e);
    if (!ph.length) return '';
    var hm = uhrJetzt();
    return '<div class="card fahrplan"><div class="kicker">Tagesfahrplan</div><h3>So läuft ' + esc(e.kurz || e.titel) + ' ab</h3><ol class="fp">' + ph.map(function (b) {
      var aktiv = b.von && hm >= b.von && hm < b.bis;
      return '<li class="' + (aktiv ? 'jetzt' : '') + (b.art === 'pause' ? ' fppause' : '') + '"><button data-scroll="' + b._anker + '"><span class="fpz">' + esc(b.von || '') + '</span><span class="fpt">' + (ART[b.art] || '') + ' ' + esc(b.titel || 'Pause') + (aktiv ? ' <b class="jetztmarke">jetzt</b>' : '') + '</span><span class="fps">' + esc(b.art === 'pause' ? '' : (SOZIAL[b.sozial] || '')) + '</span></button></li>';
    }).join('') + '</ol><p class="leit">Tippe auf eine Zeile, um dorthin zu springen. Die Markierung „jetzt“ richtet sich nach der Uhrzeit deines Geräts.</p></div>';
  }
  function blockStopp(b) {
    return '<div class="card stopp"><div class="kicker">Stopp</div><h3>✋ ' + esc(b.titel || 'Jetzt alle zusammen') + '</h3>' + (b.html || '') + clipLinks(b.clips) + '</div>';
  }
  function mitBid(h, bid) { return h.replace(/^<div class="card/, '<div data-bid="' + bid + '" class="card'); }
  function stationsFolge(b) {
    var wahl = S.werte['st_' + b.id];

  function blockStationen(b, eid) {
    var wahl = S.werte['st_' + b.id];

  function blockCheckliste(b) {
    return '<div class="card checkliste"><div class="kicker">Bevor du gehst</div><h3>✅ ' + esc(b.titel || 'Checkliste') + '</h3>' + b.punkte.map(function (pt, i) {
      var k = 'cl_' + b.id + '_' + i;

  }
  function blockIdeen(b) {

      '<label class="feld" for="idee_neu">Neue Idee</label><input type="text" id="idee_neu" placeholder="z. B. Live-Druckkurve auf dem großen Bildschirm"><div class="reihe"><button class="btn klein" data-idee="neu">Idee notieren</button></div>' +
      (l.length ? '<ol>' + l.map(function (t, i) { return '<li>' + esc(t) + ' <button class="btn klein sek" data-ideeweg="' + i + '" aria-label="Idee löschen">✕</button></li>'; }).join('') + '</ol>' : '') + '</div>';
  }
  function blockFotoliste(b) {

  function blockHtml(b, eid) {
    switch (b.typ) {
      case 'text': return blockText(b);

      case 'stopp': return blockStopp(b);
      case 'stationen': return blockStationen(b, eid);
      case 'checkliste': return blockCheckliste(b);
      case 'ideen': return blockIdeen(b);
      case 'fotoliste': return blockFotoliste(b);
      default: return '';
    }
  }

  /* ---------- Indizes ---------- */
  var etappen = {}, blockIndex = {}, alleFragen = {};
  function registriere(b, bid) {
    if (b._bid) return;
    b._bid = bid;
    blockIndex[bid] = b;
    if (b.typ === 'phase') b._anker = 'ph_' + bid;
    if (b.typ === 'quiz') b.fragen.forEach(function (q) { alleFragen[q.id] = q; });
    if (b.typ === 'stationen') ['A', 'B'].forEach(function (k) {
      ['r1', 'r2'].forEach(function (r) { b.stationen[k][r].forEach(function (sb, j) { registriere(sb, bid + '_' + k + r + '_' + j); }); });
    });
  }
  P.etappen.forEach(function (e) {
    etappen[e.id] = e;
    e.bloecke.forEach(function (b, i) { registriere(b, e.id + '_' + i); });

  function flach(e) {
    var l = [];
    e.bloecke.forEach(function (b) {

      if (b.typ === 'stationen') {
        var folge = stationsFolge(b) || [[1, 'A', b.stationen.A.r1], [2, 'B', b.stationen.B.r2]];
        folge.forEach(function (f) { f[2].forEach(function (sb) { l.push(sb); }); });
      }

  }
  function etappenFortschritt(e) {
    var ges = 0, fertig = 0;

      if (b.typ === 'quiz') b.fragen.forEach(function (q) { ges++; if (S.quiz[q.id] && S.quiz[q.id].fertig) fertig++; });

  }

  /* ---------- Ansichten ---------- */
  function tage(bis) {
    var d = (new Date(bis + 'T08:00:00') - new Date()) / 86400000;

  }
  function startSeite() {
    var p = punkte(), r = rang(p);

      '<div class="stats"><div class="stat"><b>' + tage(P.flug) + '</b>Tage bis zum Flugfenster</div><div class="stat"><b>' + p + '</b>Missionspunkte</div><div class="stat"><b>' + esc(r.name) + '</b>dein Rang</div>' + (S.team ? '<div class="stat"><b>Team ' + esc(S.team) + '</b>' + esc(S.rolle || 'Rolle offen') + '</div>' : '') + '</div>' +
      '<div class="rankladder">' + P.raenge.map(function (x) { return '<span class="' + (x === r ? 'on' : '') + '">' + esc(x.name) + '</span>'; }).join('') + '</div></div></section><div class="wrap step">';
    if (!S.team) html += '<div class="card" style="border-left:6px solid var(--acc)"><h3>Willkommen an Bord</h3><p>Trage zuerst deinen Namen ein und wähle dein Team, sobald es feststeht.</p><a class="btn" href="#/team">Zum Profil</a></div>';
    P.jahre.forEach(function (j) {

      if (j.etappen) {

  function etappenSeite(eid) {

  function logbuchSeite() {
    var html = '<div class="wrap step"><h2 style="margin:4px 0 6px">📓 Projektlogbuch</h2><p class="leit">' + esc(S.name || 'Name fehlt') + (S.team ? ', Team ' + esc(S.team) : '') + (S.rolle ? ', ' + esc(S.rolle) : '') + '</p>' +
      '<div class="reihe" style="margin-bottom:12px"><button class="btn" id="drucken">🖨️ Als PDF drucken</button><a class="btn sek" href="#/team">Profil</a></div>';
    P.jahre.forEach(function (j) {
      (j.etappen || []).forEach(function (eid) {
        var e = etappen[eid];
        if (!flach(e).some(function (b) { return b.typ === 'logbuch'; })) return;
        html += '<div data-bid="lb_' + eid + '">' + blockLogbuch({ titel: e.titel }, eid).replace('<div class="card">', '<div class="card">') + '</div>';
      });
    });
    return html + '</div>';
  }
  function drucken() {
    var d = document.getElementById('druck');
    var h = '<h1>Projektlogbuch ' + esc(P.titel) + '</h1><p>' + esc(S.name || '') + (S.team ? ', Team ' + esc(S.team) : '') + (S.rolle ? ', Rolle: ' + esc(S.rolle) : '') + ', gedruckt am ' + new Date().toLocaleDateString('de-DE') + '</p>';
    P.jahre.forEach(function (j) {
      (j.etappen || []).forEach(function (eid) {
        var e = etappen[eid], l = S.log[eid];
        if (!l) return;
        h += '<h2>' + esc(e.tag + ': ' + e.titel) + '</h2>' + P.logFragen.map(function (f, i) { return '<div class="eintrag"><b>' + esc(f) + '</b>' + esc(l[i] || '').replace(/\n/g, '<br>') + '</div>'; }).join('');
      });
    });
    var ris = riskEintraege();
    if (ris.length) h += '<h2>Risikomatrix (Rangfolge)</h2><ol>' + ris.sort(function (x, y) { return y.w * y.a - x.w * x.a; }).map(function (e) { return '<li>' + esc(e.k + ' ' + e.t) + ' (' + e.w * e.a + ')</li>'; }).join('') + '</ol>';
    d.innerHTML = h;
    document.body.classList.add('drucken');
    setTimeout(function () { window.print(); document.body.classList.remove('drucken'); }, 50);
  }

  function teamSeite() {
    var p = punkte();
    var html = '<div class="wrap step"><h2 style="margin:4px 0 10px">👥 Team und Profil</h2><div class="card"><h3>Dein Profil</h3>' + profilFelder() + '<p class="leit" style="margin-top:10px">Missionspunkte: ' + p + '. Punkte gibt es für erledigte Aufträge (10), Quizfragen im ersten Versuch (5), vollständige Logbucheinträge (10) und gelöste Fallakten (5).</p></div>';
    html += blockTeamwahl().replace(profilFelder(), '');
    html += '<div class="card"><h3>Rollen im Team</h3><p>Die Rollen wechseln jedes Jahr. So lernt jeder alle Seiten des Projekts kennen.</p><ul>' + P.rollen.map(function (r) { return '<li><b>' + esc(r.name) + ':</b> ' + esc(r.text) + '</li>'; }).join('') + '</ul></div>';
    html += '<div class="card"><h3>Teamvertrag</h3><p>Drei Regeln, auf die sich euer Team einigt.</p>' + [0, 1, 2].map(function (i) { return '<label class="feld" for="tv_' + i + '">Regel ' + (i + 1) + '</label><input type="text" id="tv_' + i + '" data-tv="' + i + '" value="' + esc(S.vertrag[i] || '') + '">'; }).join('') + '</div>';
    html += '<div class="card"><h3>So wird bewertet</h3><table class="tabelle"><thead><tr><th>Kriterium</th><th>Anteil</th><th>gut erfüllt, wenn</th></tr></thead><tbody>' + P.bewertung.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    html += '<div class="card"><h3>Speicher</h3><p class="leit">Dein Fortschritt liegt nur auf diesem Gerät. Wechselst du das Gerät, beginnst du neu. Drucke dein Logbuch deshalb nach jedem Projekttag.</p><button class="btn sek" id="reset">Alles zurücksetzen</button></div>';
    return html + '</div>';
  }

  function einzelSeite(typ) {
    var b = { typ: typ };
    var titel = { fallakte: '🔎 Fallakte', risiko: '⚠️ Risikomatrix', pitch: '🎤 Pitch' }[typ];
    return '<div class="wrap step"><h2 style="margin:4px 0 10px">' + titel + '</h2>' + blockHtml(b, 'x').replace(/^<div class="card/, '<div data-bid="x_' + typ + '" class="card') + '</div>';
  }

  /* ---------- Router ---------- */
  var TABS = [['#/', '🗺️', 'Mission'], ['#/rechner', '🧮', 'Rechner'], ['#/fallakte', '🔎', 'Fallakte'], ['#/logbuch', '📓', 'Logbuch'], ['#/team', '👥', 'Team']];
  function render() {
    var h = location.hash || '#/';
    var teile = h.replace(/^#\//, '').split('/');
    var html;
    if (teile[0] === 'e') html = etappenSeite(teile[1]);
    else if (teile[0] === 'rechner') html = rechnerSeite(teile[1]);
    else if (teile[0] === 'logbuch') html = logbuchSeite();
    else if (teile[0] === 'team') html = teamSeite();
    else if (teile[0] === 'fallakte' || teile[0] === 'risiko' || teile[0] === 'pitch') html = einzelSeite(teile[0]);
    else html = startSeite();
    app.innerHTML = html;
    rechnerStarten(app);
    $$('[data-mt]', app).forEach(function (k) { if (!k.dataset.bid) k.dataset.bid = k.closest('[data-bid]') ? k.closest('[data-bid]').dataset.bid : ''; messDia(k); });
    $('#kopf').textContent = P.kurztitel;
    $('#tabs').innerHTML = TABS.map(function (t) {
      var on = (t[0] === '#/' ? (h === '#/' || h === '' || h.indexOf('#/e/') === 0) : h.indexOf(t[0]) === 0);
      return '<a href="' + t[0] + '" class="' + (on ? 'on' : '') + '"><span>' + t[1] + '</span>' + t[2] + '</a>';
    }).join('');
    kopfZeile();
  }
  window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });

  /* ---------- Ereignisse ---------- */
  app.addEventListener('click', function (ev) {
    var t = ev.target;
    if (quizKlick(ev)) return;
    var fo = t.closest('[data-fo]');
    if (fo) {
      var karte = fo.closest('[data-fall]'), cid = karte.dataset.fall;
      var st = S.fall[cid] || {};
      st[fo.dataset.fk] = +fo.dataset.fo;
      S.fall[cid] = st;
      if (st.u != null && st.m != null) toast('+5 Punkte, Karte in der Risikomatrix');
      speichern(); neuZeichnen(); return;
    }
    var fi = t.closest('[data-fi]');
    if (fi) { S.werte.fallfilter = fi.dataset.fi; speichern(); neuZeichnen(); return; }
    if (t.dataset.frei) {
      var inp = $('#code_' + t.dataset.frei);
      if (codeOk(inp.value)) { S.frei[t.dataset.frei] = true; speichern(); toast('Freigegeben'); neuZeichnen(); }
      else { inp.value = ''; toast('Code stimmt nicht'); }
      return;
    }
    if (t.dataset.wunsch != null) {
      var idx = +t.dataset.wunsch, andere = 1 - idx;
      S.wunsch[idx] = t.dataset.t;
      if (S.wunsch[andere] === t.dataset.t) S.wunsch[andere] = '';
      speichern(); neuZeichnen(); return;
    }
    if (t.dataset.ri === 'neu') {
      var tx = $('#ri_t').value.trim();
      if (!tx) { toast('Erst ein Risiko eintragen'); return; }
      S.eigen.push({ t: tx, w: +$('[data-fw="neu"][data-k="w"]').value, a: +$('[data-fw="neu"][data-k="a"]').value });
      speichern(); neuZeichnen(); return;
    }
    if (t.dataset.riweg != null) { S.eigen.splice(+t.dataset.riweg, 1); speichern(); neuZeichnen(); return; }
    if (t.id === 'drucken') { drucken(); return; }
    var sc = t.closest('[data-scroll]');
    if (sc) {
      var ziel = document.getElementById(sc.dataset.scroll);
      if (ziel) { ziel.scrollIntoView(); window.scrollBy(0, -70); }
      else toast('Erscheint erst nach der Freigabe');
      return;
    }
    if (t.dataset.weiche) { S.werte['st_' + t.dataset.weiche] = t.dataset.st; speichern(); neuZeichnen(); return; }
    if (t.dataset.idee === 'neu') {
      var it = $('#idee_neu').value.trim();
      if (!it) { toast('Erst eine Idee eintragen'); return; }
      S.werte.ideen = (S.werte.ideen || []).concat([it]);
      speichern(); neuZeichnen(); return;
    }
    if (t.dataset.ideeweg != null) { S.werte.ideen.splice(+t.dataset.ideeweg, 1); speichern(); neuZeichnen(); return; }
    if (t.id === 'reset') {
      if (confirm('Wirklich alles löschen? Logbuch, Punkte und Freigaben gehen verloren.')) { S = leer(); speichern(); render(); }
    }
  });
  app.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.dataset.done) {
      S.done[t.dataset.done] = t.checked;
      if (t.checked) toast('+10 Punkte');
      speichern(); neuZeichnen(); return;
    }
    if (t.dataset.fw && t.dataset.fw !== 'neu') {
      var st = S.fall[t.dataset.fw] || {};
      st[t.dataset.k] = +t.value;
      S.fall[t.dataset.fw] = st;
      speichern(); neuZeichnen(); return;
    }
    if (t.dataset.pf) { S[t.dataset.pf] = t.value; speichern(); return; }
    if (t.dataset.pc) { S.werte[t.dataset.pc] = t.checked; speichern(); return; }
  });
  app.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.dataset.log) {
      var l = S.log[t.dataset.log] || {};
      l[t.dataset.li] = t.value;
      S.log[t.dataset.log] = l;
      speichern(); return;
    }
    if (t.dataset.pf) { S[t.dataset.pf] = t.value; speichern(); return; }
    if (t.dataset.pitch != null) { S.pitch[t.dataset.pitch] = t.value; speichern(); return; }
    if (t.dataset.notiz) {
      var nw = S.werte['n_' + t.dataset.notiz] || {};
      nw[t.dataset.ni] = t.value;
      S.werte['n_' + t.dataset.notiz] = nw;
      speichern(); return;
    }
    if (t.dataset.fb) { S.feedback[t.dataset.fb] = t.value; speichern(); return; }
    if (t.dataset.tv != null) { S.vertrag[t.dataset.tv] = t.value; speichern(); return; }
    if (t.dataset.mk) {
      var karte = t.closest('[data-mt]');
      var bid = karte.dataset.mt;
      var w = S.werte['t_' + bid] || {};
      w[t.dataset.mk] = t.value;
      S.werte['t_' + bid] = w;
      speichern(); messDia(karte); return;
    }
  });
  function neuZeichnen() {
    var y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }

  render();
})();

</script>
</body>
</html>
